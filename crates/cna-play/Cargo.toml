[package]
name = "cna-play"
description = "Bounded launcher for server-backed AI seat integration."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cna-server = { path = "../cna-server" }
cna-seats = { path = "../cna-seats" }
cna-core = { path = "../cna-core" }
cna-protocol = { path = "../cna-protocol" }
serde_json.workspace = true
serde.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "signal"] }
axum = "0.8"
tempfile = "3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.29"


[lints]
workspace = true