[package]
name = "cna-server"
description = "Authoritative campaign runner, persistence and local live API."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cna-core = { path = "../cna-core" }
cna-protocol = { path = "../cna-protocol" }
cna-seats = { path = "../cna-seats" }
cna-sandbox = { path = "../cna-sandbox" }
cna-content = { path = "../cna-content" }
cna-rules = { path = "../cna-rules" }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
serde.workspace = true
serde_json.workspace = true
rand_core.workspace = true
rand_chacha.workspace = true
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"] }
axum = { version = "0.8", features = ["ws"] }
tracing = "0.1"
tower-http = { version = "0.6", features = ["cors", "fs"] }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[lints]
workspace = true


