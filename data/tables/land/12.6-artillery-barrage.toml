# Artillery Barrage Table (land:12.6): "Barrage Against Land Units Combat Results Table".

[table]
id = "land.12.6.artillery_barrage"
case = "12.6"
title = "Barrage Against Land Units Combat Results Table"
src = ["land:12.6"]
transcribed_from = ["vassal:12.6 Barrage Against Land Units Combat Results Table.png"]
verification = "double"
dice = "2d6_reading"
notes = """
Read a distinguishable pair in a designated order: first die for tens, second for units. All 36 readings
from 11 to 66 occur, using digits 1 to 6 (land:12.42; interp:land-0022). Use the column for the Actual Barrage Points fired at the target (after any
terrain column shift to the left, land:12.33) and find the cell whose inclusive dice range contains the
reading, in the block for the target's class (Infantry, Armor, Gun; Truck is rolled separately for trucks in
the hex, land:12.46). A column absent from a result's cells means that result cannot occur there (a printed
dash). In every column the cells of one class cover all 36 readings exactly once (checked in two passes).
Result codes: no_effect; pinned (unit loses nothing but is pinned: may not Retreat Before Assault and may not
take part in Assault); lose_1 / lose_2 (one or two TOE strength points lost; infantry and armor also pinned
on lose results; if infantry were in trucks, one truck point is eliminated; guns and trucks lose points
without pinning). A Pin result does not occur against Gun-class units.
"""

