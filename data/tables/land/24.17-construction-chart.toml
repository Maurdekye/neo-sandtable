[[footnote]]
id = "dagger_enemy_zoc"
text = "Unless otherwise stated, an item may not be constructed in an enemy ZOC."

[[footnote]]
id = "star_hot_weather_water"
text = "If the hex is affected by Hot Weather, an additional 10 Water Points are required for each item under construction, other than a supply dump."

[[footnote]]
id = "double_dagger_one_at_a_time"
text = "Only one may be built, rebuilt or blocked at a time."
