[[row]]
item = "flying_boat_basin_or_alighting_area"
situation = "rebuild_1_level_basin_or_build_alighting_area"
footnotes = ["dagger_enemy_zoc", "double_dagger_one_at_a_time", "star_hot_weather_water"]
units = [["e_bn"], ["e_coy"], ["sgsu"]]
supplies = { fuel = 10, stores = 10 }
