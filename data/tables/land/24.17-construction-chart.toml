op_stages = 1
restrictions = ["the ports of Tripoli, Bizerta (Tunis), Alexandria (E3613), Aboukir (E3815) and Rosetta (E4019) may not be blocked"]

[[row]]
item = "real_supply_dump"
situation = "build"
units = [["any_unit_1_toe"]]
supplies = { stores = 10 }
