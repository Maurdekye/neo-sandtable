# Terrain Effects Chart (land:8.37). Transcribed from the chart image; every cell cites the footnote
# numbers printed on it. See the notes field for how to read the cell shapes.

[table]
id = "land.8.37.terrain_effects"
case = "8.37"
title = "Terrain Effects Chart"
src = ["land:8.37", "errata79:8.37"]
transcribed_from = ["vassal:TEC.png"]
verification = "double"
dice = "none"
notes = """
Cell shapes. CP and breakdown amounts are stored doubled (suffix _x2) so that half points are exact
integers: enter_x2 = 4 means a flat cost of 2 CP; enter_x2 = 1 means one half CP. 'enter' is a cost
paid to enter the hex; 'add' is an extra cost paid on top of the hex cost when crossing a hexside
feature (printed with a plus sign). 'value' in the breakdown column is the printed number as is.
{ none = true } is a printed dash (no effect or no value). { prohibited = true } is a printed P.
Combat shifts are column shifts on the relevant combat results table: dir 'L' shifts left, dir 'R'
right, n columns; { dir = 'none' } is a dash. The chart image already carries the 1979 corrections
(footnote 4 on Major City, footnote 8 on Track). The row 'gravel' is labelled Gravel in the table
and Rock/Gravel in the terrain key. Rows with same_as_terrain_all_purposes use whatever other
terrain is in the hex. Map classes with no row here (sea, coast, port, airfield, flying boat basin
and alighting area, training area, off-map airbases, border, unfinished road, unfinished railroad)
carry no cost on this chart; see [[legend]] and land:8.47 for unfinished road and railroad.
"""

