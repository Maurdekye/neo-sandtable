[[footnote]]
id = 1
applies_to = ["stacking_limit"]
text = "A garrison unit in its assigned hex takes no stacking space. Anti-aircraft units are free in a Major City hex (no limit on how many); up to three are free in an Airfield hex and one in an Air Landing Strip hex."

[[footnote]]
id = 2
applies_to = ["salt_marsh"]
text = "Vehicles other than Light Trucks, Recce-type units and motorcycle infantry may enter or leave the hex only along a track. Motorized units may not fight into or out of Salt Marsh (land:8.44)."

[[footnote]]
id = 3
applies_to = ["desert.cp_mot"]
text = "Light Trucks, motorcycle reconnaissance units and motorcycle infantry may not enter Desert hexes at all, even along a track."

[[footnote]]
id = 4
applies_to = ["major_city"]
text = "Major City hexes of Alexandria and Cairo are Level Three fortifications; every other Major City is Level Two."

[[footnote]]
id = 5
applies_to = ["railroad"]
text = "Commonwealth units may be able to use Rail Movement (land:8.7)."

[[footnote]]
id = 6
applies_to = ["road"]
text = "A road cancels every hexside terrain-feature entry cost and Breakdown Point value."

[[footnote]]
id = 7
applies_to = ["road.stacking_limit", "track.stacking_limit"]
text = "The limit applies only to the units and truck points in that hex at that moment."

[[footnote]]
id = 8
applies_to = ["track"]
text = "A track halves all terrain-feature entry costs and all hex and hexside Breakdown Point values, except the CP spent and the Breakdown incurred by moving a vehicle down an escarpment."

[[footnote]]
id = 9
applies_to = ["down_escarpment.cp_mot"]
text = "Motorized units and trucks may cross a down escarpment only on a track."

[[footnote]]
id = 10
applies_to = ["wadi.cp_non_mot", "wadi.cp_mot"]
text = "During a Rainstorm a wadi hexside may be crossed only where a road or railroad (treated as a road) crosses it, at two additional CP."

[[footnote]]
id = 11
applies_to = ["major_river.cp_mot"]
text = "May be crossed only where a road or railroad crosses the hexside; a motorized unit crossing that way pays no additional CP or Breakdown Points."

[[footnote]]
id = 12
applies_to = ["fortification_level_one.barrage_shift", "fortification_level_two.barrage_shift", "fortification_level_three.barrage_shift"]
text = "Armor targets get the Barrage defensive benefit only if the hex is a Major City hex."

[[footnote]]
id = 13
applies_to = ["friendly_minefield", "enemy_minefield"]
text = "Engineer units reduce the cost to enter (land:26.2). If assaulting forces stand in an enemy minefield, the non-phasing forces receive L1 shifts for Anti-Armor and Close Assault unless already getting them for occupying a friendly minefield."

