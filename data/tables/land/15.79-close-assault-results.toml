# The Close Assault Combat Results Table (land:15.79).

[table]
id = "land.15.79.close_assault_results"
case = "15.79"
title = "The Close Assault Combat Results Table"
src = ["land:15.79", "errata79:15.79"]
transcribed_from = ["vassal:15.79 The Close Assault Combat Results Table.png"]
verification = "double"
dice = "2d6_reading"
notes = """
Each side rolls a designated dice pair once. First die gives tens and second gives units, so all 36 readings
11-66 occur (interp:land-0022). Losses use this reading; Engaged, Captured and Retreat use the plain sum
of the same two dice (2 to 12). Both sides use the same column, the
Adjusted Assault Differential, but each its own half of the table: [[loss_row]] gives, for a side, the
percentage of its Raw Assault Points lost for each dice-reading range; [[sum_result]] gives the sums that
trigger Captured (go on to the Prisoners Captured table, land:15.89), Engaged (attacker half; ignored if
the defender retreats after the combat; otherwise the units are Engaged, else In Contact) and Retreat
(defender half; at least that many hexes or take extra casualties; the attacker never retreats
involuntarily). A cell absent from a row is a printed dash. The columns marked overrun are the Overrun
section (land:15.77). The first column covers a differential of -11 or worse and the last +17 or better
(printed 'ET Seq'). For the loss rows, every column of each side covers all 36 dice readings exactly once
with one exception, recorded in [[gap]]. The errata correction (defender, +4 column, 10% line is 34-45) is
already applied in the image and here. In the printed layout the three defender retreat sub-rows share
their left cell with the row labels, so the -11 and worse column shows no retreat results.
"""

[[gap]]
side = "defender"
column = "p2"
readings = [34, 35, 36]
description = "The printed defender cells for the +2 column leave readings 34, 35 and 36 uncovered (10% line ends at 33, 5% line starts at 41). Values are transcribed as printed; see interpretation land-0011 for the proposed fill."
interp = "land-0011"

