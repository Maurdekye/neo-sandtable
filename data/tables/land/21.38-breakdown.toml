# Breakdown Table (land:21.38).

[table]
id = "land.21.38.breakdown"
case = "21.38"
title = "Breakdown Table"
src = ["land:21.38"]
transcribed_from = ["vassal:21.38 Breakdown Table.png"]
verification = "double"
dice = "2d6_reading"
notes = """
Total the Breakdown Points a vehicle type accumulated (round fractions up), shift columns for the type's
Breakdown Adjustment Rating (BAR) and for weather (right is worse), then roll two dice read in sequence
(land:21.34). The cell containing the reading gives the percentage of that type of vehicle (TOE strength
points, trucks counting as TOE points) that breaks down. Hot weather shifts one column right; Sandstorms shift
one column right if at least 50% of the accumulated Breakdown Points were acquired in map sections with
sandstorms. BAR and weather shifts are cumulative. The 71+ column is the last; adjustments cannot go higher.
The printed sandstorm measure above disagrees with the CP measure in land:21.37(d); see interp:land-0027.
Motorcycles and artillery with inherent transport never break down. In every column the cells cover all 36
dice readings exactly once (checked in two passes). A column absent from a row is a printed dash.
"""


