# Capability Point Expenditure Summary (land:6.3).

[table]
id = "land.6.3.capability_point_expenditure_summary"
case = "6.3"
title = "Capability Point Expenditure Summary"
src = ["land:6.3"]
transcribed_from = ["vassal:6.3 Capability Point Expediture Summary.png"]
verification = "double"
dice = "none"
notes = """
One row per action. 'cost' shapes: { cp = N } flat CP; { tec = true } the Terrain Effects Chart cost
of the hex entered (land:8.37); { cp = N, plus_tec = true } N CP plus the chart cost; { cpa_plus_tec =
true } the unit's whole CPA plus chart cost; { cpa_fraction = [1, 3] } that fraction of the unit's
CPA; { cp_pair = [a, b] } two printed alternatives separated by a slash, in the order printed (see
the notes on rows construct_supply_dump and commando_amphibious_landing). Rows with 'sub' list
several sub-cases of one action. TEC means the chart cost for the hex's terrain type; Eng means an
Engineer unit is present. The CP costs apply to units spending CP; some actions that cost no CP still
restrict a unit's ability to spend CP (printed remark).
"""

