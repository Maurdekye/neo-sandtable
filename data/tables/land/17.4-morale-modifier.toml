# Morale Modifier Table (land:17.4), the Morale Modification Table.

[table]
id = "land.17.4.morale_modifier"
case = "17.4"
title = "Morale Modifier Table"
src = ["land:17.4"]
transcribed_from = ["vassal:17.4 Morale Modifier Table.png"]
verification = "double"
dice = "2d6_reading"
notes = """
Roll two dice read in sequence (larger die as tens, land:17.22) in the row for the unit's Cohesion Level
(Disorganization Level on the chart; plus is better). The column whose dice range contains the reading is
the modifier added to the unit's Basic Morale for that combat: plus_4 to plus_1 raise it, no_change leaves
it, minus_1 to minus_4 lower it, and surrender means all the units surrender (land:17.25; exception 17.26).
The adjusted rating is clamped to +3 .. -3 (land:17.23). Levels of +8 or higher use the first row and
-17 or worse the last row (land:17.24). A column missing from a row is a printed dash. In every row the cells
cover all 36 dice readings exactly once with one exception, recorded in [[gap]].
"""

[[gap]]
cohesion_level = -4
readings = [56]
description = "The printed -4 row leaves reading 56 uncovered: minus_2 ends at 55 and minus_3 starts at 61. Values are transcribed as printed; see interpretation land-0012 for the proposed fill."
interp = "land-0012"

