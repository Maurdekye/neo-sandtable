# Axis Replacement Pool (land:20.66): truck production chart (20.66a), German production chart, Italian production chart.

[table]
id = "land.20.66.axis_replacement_pool"
case = "20.66"
title = "Axis Replacement Pool"
src = ["land:20.66", "errata79:20.66"]
transcribed_from = ["vassal:20.66 Axis Product and Replacement.png"]
verification = "double"
dice = "none"
notes = """
Three charts in one image. Each row gives an item, the total pool (number) of replacement points that may be
brought in, availability lines of (max points per Game-Turn, first and last Game-Turn on which the points may be
PLANNED; arrival is two Game-Turns later) and the shipping tonnage per point. Where an item has two printed
numbers the player may bring in the sum of both, but no more than the first number during the period listed
beside it; here each availability line carries the 'pool' figure printed on its line. A line with only a first
game turn (for example 13+) runs to the end of the campaign. Markers: star = the maximum applies to every two
weeks (first and second weeks of a month, third and fourth weeks); dagger = the maximum is per month, by
calendar month; double_dagger = the French pieces located in the Tunis box, available on Game-Turn 39 without
the two-turn delay, movable by land or coastal shipping, needing no supplies until Map Section A proper, and at
most two points of each type may be called up per Game-Turn. All Italian armored recce/armored car points are
Autobelinda 41 (ID code vv). There are no M 11/39 tank replacements (the errata fixes the explanation that said
13/39). A handwritten 30 beside the Italian Light AA number 15 on the source image is an annotation and is not
transcribed as data; the printed total is 15 + 45 = 60, as the chart's own example states. The German 7.5cm IG18 is printed as 75.cm IG18. The chart's example
text gives game turns 4 to 26 for Light AA while the row prints 2 to 24; the row is transcribed as printed.
"""


