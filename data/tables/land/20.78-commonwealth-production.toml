# Commonwealth Production System (land:20.78): truck production (A), infantry production (B), production chart (C).

[table]
id = "land.20.78.commonwealth_production"
case = "20.78"
title = "Commonwealth Production System"
src = ["land:20.78"]
transcribed_from = ["vassal:20.78 Commonwealth Production System.png"]
verification = "double"
dice = "other"
notes = """
Three tables. 20.78A (truck production): roll one die for each truck type (three rolls); the number cell is
the trucks of that type that arrive four Game-Turns later; use the left block for Game-Turns 1 to 30 and the
right block for 31 to 107 (increased US Lend-Lease); no more than 25% of the trucks produced may arrive at
Alexandria in one Game-Turn; trucks produced here do not affect or count with trucks arriving as reinforcements.
20.78B (infantry production): roll two dice (sum 2 to 12) in the column for the Game-Turn the points are
planned for; they arrive four Game-Turns later and must all be placed in the same city; 'none' means no
points. 20.78C (production chart): per item the total pool (number), max points per Game-Turn, and the first
and last Game-Turn on which it may be planned. In this chart a star on the max means the maximum is per month
(calendar months, not four-week cycles from the original week of availability) and a dagger means the
maximum is for each half of a month (the first and second weeks, and the third and fourth weeks); this is the
reverse of the Axis charts. The Tiger Convoy (Game-Turn 32), a shipment of tanks and planes, is in addition to
this chart.
"""


