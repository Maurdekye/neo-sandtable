# Simplified Axis Naval Convoy Bombing Chart (land:32.66).

[table]
id = "land.32.66.axis_convoy_bombing"
case = "32.66"
title = "Simplified Axis Naval Convoy Bombing Chart"
src = ["land:32.66", "land:32.64"]
transcribed_from = ["vassal:32.66 Simplified Axis Naval Convoy Bombing Chart.png"]
verification = "double"
dice = "none"
notes = """
Abstract-logistics table (not used in the full-systems profile). Find the convoy route (1 to 6) the Axis convoy is
using and read down its column to the westernmost east-west hex row beyond which a qualifying Allied division is
located; read across to the row's Bomb Points, which names the Air Bombardment and Secondary Barrage Targets CRT
column used for the attack (land:32.64). Each cell is a location code: a map-section letter (A to E), the two lower
case x's meaning any north-south hex may be used, and the two digits are the east-west hex row, for example Cxx01
is hex row 01 of map section C. A qualifying Allied division is any complete (non-shell) Allied division that is east
of, or in the same east-west row as, at least one other non-shell Allied division. A printed dash means that route
column does not reach that bomb-point row. Attacks on one convoy do not affect attacks on others.
"""

