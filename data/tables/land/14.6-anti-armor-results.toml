# Anti-Armor Fire Combat Results Table (land:14.6).

[table]
id = "land.14.6.anti_armor_results"
case = "14.6"
title = "Anti-Armor Fire Combat Results Table"
src = ["land:14.6"]
transcribed_from = ["vassal:14.6 Anti-Armor Fire Combat Results Table.png"]
verification = "double"
dice = "2d6_reading"
notes = """
Roll two dice read in sequence (larger die as tens). Find the row whose pair of readings contains the roll
(each row covers two adjacent readings, for example 11 and 12) and the column for the Actual Anti-Armor
Points fired at the hex after terrain column shifts; the cell is the number of Damage Points inflicted.
Each row's damage_points_by_column omits columns where the printed cell is a dash (no damage). Column
'0*' is used only when the firer has 1 to 4 Raw Anti-Armor Points before any terrain effects; a column
shift below zero uses the zero-points handling in the footnote. Column '16+' applies to 16 or more points.
Modifier: the phasing player moves his dice roll up by one row (a roll of 11 or 12 is not changed). The
table has been checked for non-decreasing values down every column and across every row.
"""

[[column]]
id = "0*"
actual_points_min = 0
actual_points_max = 0
only_if_raw_points_between = [1, 4]
[[column]]
id = "16+"
actual_points_min = 16

[[row]]
dice_reading_range = "11-12"
dice = [11, 12]
damage_points_by_column = { "3" = 1, "4" = 2, "5" = 3, "6" = 4, "7" = 6, "8" = 8, "9" = 10, "10" = 11, "11" = 12, "12" = 14, "13" = 16, "14" = 18, "15" = 20, "16+" = 22 }

