Commonwealth off-map air facilities on map section E: the map hex at which planes enter or leave the
map, the distance in hexes from the facility to that hex, and the maximum number of squadrons based
there. Port Said is a flying boat basin (footnote). No planes may be based in Ethiopia until the
first OpStage of Game-Turn 35.
"""

