transcribed_from = ["vassal:56.18 Axis Naval Convoy Air DIstance Chart.png"]
verification = "double"
dice = "none"
notes = """
Distance in hexes from each air origin to each of the six Axis shipping lanes. Sicily, Italy and
Crete mean aircraft flying from any of those boxes; Malta means aircraft flying from any Malta
hex. Benghazi, Derna and Tobruk are the Rally Points. A plane flying a mission from North Africa
to a lane needs Range at least the hexes from its air facility to a Rally Point plus the hexes
from that Rally Point to the lane. A dash (printed for lane 1 / Crete) is recorded as an omitted
value listed in dash_columns.
"""

