months = { jan = { cw_percent = 2, axis_percent = 3 }, feb = { cw_percent = 2, axis_percent = 3 }, mar = { cw_percent = 10, axis_percent = 1 }, apr = { cw_percent = 9, axis_percent = 2 }, may = { cw_percent = 7, axis_percent = 3 }, jun = { cw_percent = 5, axis_percent = 4 }, jul = { cw_percent = 4, axis_percent = 3 }, aug = { cw_percent = 3, axis_percent = 3 }, sep = { cw_percent = 3, axis_percent = 3 }, oct = { cw_percent = 3, axis_percent = 3 }, nov = { cw_percent = 3, axis_percent = 5 }, dec = { cw_percent = 3, axis_percent = 4 } }
dash_months = []

