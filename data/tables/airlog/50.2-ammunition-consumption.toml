[table]
id = "airlog.50.2.ammunition_consumption"
case = "50.2"
title = "Ammunition Consumption Rates Table"
src = ["airlog:50.2"]
transcribed_from = ["vassal:50.2 Ammunition Consumption Rates Table.png"]
verification = "double"
dice = "none"
notes = """
Ammunition Points spent per TOE point (land actions) or per plane/squadron (air actions), in two
columns of rows: the Logistics game played in full ('played') and the Logistics game abstracted
('abstracted'; these rows are not used when the full Logistics game is played, which is the
Graziani profile, D2). A row whose cost is given as a rating rather than a number has no
ammo_points and carries ammo_cost_basis instead; see GAPS.md for the unclear cell.
"""

[[row]]
mode = "played"
action = "barrage"
ammo_points = 4

[[row]]
mode = "played"
action = "anti_armor"
ammo_points = 3

[[row]]
mode = "played"
action = "close_assault_armor_gun_mg_inf_hvywpn_inf"
description = "Close assault by armor-class, gun-class, MG-inf or heavy-weapons-inf units"
ammo_points = 2

[[row]]
