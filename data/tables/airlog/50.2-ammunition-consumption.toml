ammo_points = 2

[[row]]
mode = "played"
action = "rearm_squadron_tacair"
description = "Rearm any portion of a squadron's planes' tacair rating"
ammo_points = 1

[[row]]
mode = "played"
action = "rearm_one_plane_bombs_torpedoes_mines"
description = "Rearm one plane with bombs, torpedoes or mines"
