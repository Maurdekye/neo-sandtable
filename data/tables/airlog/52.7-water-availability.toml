[table]
id = "airlog.52.7.water_availability"
case = "52.7"
title = "Water Availability Table"
src = ["airlog:52.7", "airlog:52.13"]
transcribed_from = ["vassal:52.7 Water Availability Table.png"]
verification = "double"
dice = "1d6"
notes = """
Water Points drawn by one draw at a well, by die roll, for a Town (village) and a Bir. Cells marked
depletion_check are starred on the chart: after such a result the drawing player rolls one more die
secretly and the well is depleted on a 1. Major cities and oases draw without a roll and are
unlimited (not in the table). The chart column is headed 'Town'; case 52.13 calls it 'village'.
"""

