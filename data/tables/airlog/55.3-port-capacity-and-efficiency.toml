[table]
id = "airlog.55.3.port_capacity_and_efficiency"
case = "55.3"
title = "Port Capacity and Efficiency Level Chart"
src = ["airlog:55.3", "airlog:55.1", "airlog:55.25", "airlog:55.17"]
transcribed_from = ["vassal:55.3 Port Capacity and Efficiency Level Chart.png"]
verification = "double"
dice = "none"
notes = """
Per-port maximum Efficiency Level, the stacking points that may be shipped in and out per
Operations Stage, and the maximum tonnage of supplies shipped in and/or out per OpStage. A loss of
one efficiency level cuts capacity by one over the listed level. Reinforcements are never limited
by port capacity or efficiency; stacking points and tonnage are separate budgets; replacement
points shipped by Axis convoy are unloaded against the stacking-point schedule, not the tonnage
schedule. Stacking-point fields are omitted where the chart prints 'na' (not allowed); the
'in_any_one_unit_of_zero_stacking_points' flag marks the chart's dagger-double footnote.
"""

