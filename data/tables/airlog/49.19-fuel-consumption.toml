notes = """
Fuel Points consumed by one vehicle (TOE point) for CP spent moving, by that vehicle's fuel
consumption rate (columns 1-7). Values are stored in tenths of a Fuel Point (2 = 0.2) so no float is
needed. Every cell equals rate x CP / 5; the second pass checked every cell against that identity.
The chart lists only 1-4 CP and multiples of 5 up to 50; how to price other CP counts is
docs/interpretations/airlog-0001-fuel-chart-rounding.md.
"""
