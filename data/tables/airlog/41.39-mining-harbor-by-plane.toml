verification = "double"
dice = "1d6"
notes = """
For each group of six planes attempting to mine a harbor, take the average bombload of the six, find
its row, and roll one die: the harbor is mined if the die roll is equal to or less than the
listed number (0 means it cannot succeed).
"""

