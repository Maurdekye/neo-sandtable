[table]
id = "airlog.45.5.tacair_kill"
case = "45.5"
title = "TacAir Kill Table"
src = ["airlog:45.5", "airlog:45.0"]
transcribed_from = ["vassal:45.5 TacAir Kill.png"]
verification = "double"
dice = "2d6_reading"
notes = """
The adjusted TacAir differential is the firing plane's total TacAir (with pilot rating or formation
bonus) plus the Maneuver Adjustment (negative for the less maneuverable plane), minus the opposing
plane's total TacAir. Roll two dice read sequentially (11-66): a roll equal to or less than the listed
number eliminates the defending plane. 'na' means the plane may never be eliminated at that
differential. The chart column label says 'Adj TacAir Diff'.
Check against worked examples in 45.3x: differential -2 kills on 11-12 (listed 12);
differential +5 kills on 11-26 (listed 26). The 45.3 example that says +2 needs 11-22 disagrees
with the listed 16 (see interpretation airlog-0005).
"""

[[row]]
differential_max = -13          # -13 or less
kill_on_roll_at_most = "na"

[[row]]
differential = [-12, -5]
kill_on_roll_at_most = 11

