[table]
id = "airlog.44.42.axis_malta_availability"
case = "44.42"
title = "Axis Malta Availability Table"
src = ["airlog:44.42", "airlog:44.25", "airlog:44.27", "airlog:44.28"]
transcribed_from = ["vassal:44.42 Axis Malta Availability Table.png"]
verification = "double"
dice = "2d6_sum"
notes = """
For a chosen availability level (I-IV) and a two-dice total, each cell reads 'N/M': N is the percentage
of each type of plane in play and based on Sicily and Italy that may take part in the strategic
bombardment of Malta; M is used to determine the number of each type of plane available from the
Axis strategic forces (not actually in play), read as a percentage of each type of plane based
on Italy/Sicily with fractions rounded down (200 = double the number in play). The strategic forces
are calculated from all planes on Italy/Sicily regardless of how many in-play planes are actually
used, and may only be used for that Game-Turn's strategic missions over Malta. 'na' means no forces are
available for the bombardment of Malta this Game-Turn.
"""

