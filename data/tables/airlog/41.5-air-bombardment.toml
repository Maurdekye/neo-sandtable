[table]
id = "airlog.41.5.air_bombardment"
case = "41.5"
title = "Air Bombardment and Secondary Barrage Targets Table"
src = ["airlog:41.5", "errata79:41.5", "airlog:41.22", "airlog:41.3", "airlog:41.66"]
transcribed_from = ["vassal:41.5 Air Bombardment and Secondary Barrage Targets Table.png"]
verification = "double"
dice = "2d6_reading"
notes = """
Roll two dice read sequentially (11-66). Choose the column from the attack's weapon points: torpedo
points (only when attacking Commonwealth fleet ships), barrage points (for secondary barrages,
computed like the master barrage CRT) or bomb points (all other bomb attacks). Eleven columns
(the Barrage Points row follows the corrected layout of errata79:41.5: two numbers per column and a
final 21+ column; the printed 2021 chart already shows this). Within a target block the rows are
results; each row lists, per column, the inclusive range of numeric dice readings (written as lo..hi
over the 11-66 reading, in which only digits 1-6 occur) giving that result; an empty list is a dash
(result not possible in that column). Result units are given per block. Mutual consistency check
for the second pass: in every block and column the ranges of successive results tile the roll range
without gaps or overlaps (apart from non-occurring readings such as 17-20).
"""

