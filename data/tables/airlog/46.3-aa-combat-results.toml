[[footnote]]
id = "target_group_notes"
meaning = "Each Target Group is attacked separately. Attacks against a Target Group of Planes on Other Missions that contains a multiple of twelve Bomber-Class or Transport-Class aircraft (or any mix) shift the number of Flak Points one column to the right for each twelve aircraft exceeding twelve aircraft (24 aircraft shift one column right)."
