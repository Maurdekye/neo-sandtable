[table]
id = "airlog.46.3.aa_combat_results"
case = "46.3"
title = "Anti-Aircraft Combat Results Table"
src = ["airlog:46.3", "airlog:46.0", "errata79:46.4"]
transcribed_from = ["vassal:46.3 Anti-Aircraft Combat Results Table.png"]
verification = "double"
dice = "2d6_reading"
notes = """
Roll two dice read sequentially (11-66) in the column for the number of Flak Points applied to a
Target Group. Three sections: planes destroyed among 'other missions' planes, planes aborted among
'other missions' planes (a second roll in the same column), and planes destroyed among 'fighter
missions' planes. Each row lists, per column (ten columns), the inclusive roll range giving that
result (empty list = dash). The second pass confirmed that in every column the rows of each section
tile the roll range without gaps. The table notes (see footnote and 46.4) shift the column to the right
for large raids of non-fighters.
"""

