For each scenario, how many Game-Turns of Axis strategic bombardment of Malta each availability level
(I-IV) may be used: a number is the cap in Game-Turns, U (unlimited) means no cap, na means not
applicable or not allowed. Malta is not in the Last Chance scenario. In Graziani's Offensive only
Level I (unlimited) may be used.
"""

