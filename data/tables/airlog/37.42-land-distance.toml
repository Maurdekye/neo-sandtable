Shortest distance in hexes between twenty named places (lower triangle: each row lists the distance
to every place listed BEFORE it). Counted from one location (exclusive) to the other (inclusive),
including cutting across the Mediterranean as if it were an all-sea hex grid where needed. The
chart's footnote adds that a hex on one map section is always 33 hexes from the hex with the same
number on an adjacent map section (for example D4102 is 33 from C4102 and from E4102); the
reference 'Determining Shortest Distance above' points to text not in the transcribed image.
Alexandria and Cairo are single major-city hexes. Hex ids are the places' map hexes.
"""
