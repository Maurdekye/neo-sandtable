[[case]]
id = "15.81"
title = "Engaged"
summary = "Engaged locks all units in the assault together, with the heavier break-off cost of 8.6; Engaged markers go on affected units and come off at the end of the Operations Stage. Surviving adjacent assault units not Engaged are in Contact."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.close_assault"]
depends_on = ["8.6", "8.63"]
src = ["land:15.81"]

[case.applies]
graziani = "yes"

[[case]]
id = "15.82"
title = "Retreat results"
summary = "A Retreat result forces the affected units (including withheld pinned or out-of-ammo units) at least that many hexes from the inflicting enemy, along the path of least resistance toward the nearest supply dump or city; each hex not retreated costs an extra 10% loss; retreat costs CP; units in a Major City may ignore retreat results."
kind = "rule"
disposition = "decision"
seat = "either"
timing = ["opstage.movement_and_combat.combat.close_assault"]
depends_on = ["9.35", "8.12"]
src = ["land:15.82"]

[case.applies]
graziani = "yes"

[case.decision]
what = "Choose retreat paths and how far to retreat"
params = ["units", "retreat hexes"]
trigger = "triggered"
secrecy = "open"
interrupts = false

[[case]]
id = "15.83"
title = "Percentage losses procedure"
summary = "Steps: read loss % on the table; total all Raw Assault points involved (the defender adds Raw points of pinned or previously retreated units, and in an Overrun all withheld defenders); multiply, rounding up for the attacker and down for the defender (up in an Overrun), adding any extra 10% per hex not retreated; remove TOE points whose ratings absorb the Raw points (participants, and for defenders pinned or withheld units); split losses across hexes in proportion to Raw points committed."
kind = "procedure"
disposition = "decision"
seat = "either"
timing = ["opstage.movement_and_combat.combat.close_assault"]
depends_on = ["15.82", "15.77"]
src = ["land:15.83"]

[case.applies]
graziani = "yes"

[case.decision]
what = "Choose which TOE points absorb the Raw point losses"
params = ["TOE points removed per hex"]
trigger = "triggered"
secrecy = "open"
interrupts = false

[[case]]
id = "15.84"
title = "Gun losses in Close Assault"
summary = "In an Overrun all defending guns add defensive close assault points to the loss base. Forward guns lose Vulnerability points equal to at least half the Raw points lost (at least one if any Raw point was lost), AA/flak excepted; in an Overrun all defending guns are subject to this after percentage losses."
kind = "rule"
disposition = "decision"
seat = "either"
timing = ["opstage.movement_and_combat.combat.close_assault"]
depends_on = ["14.42", "12.18"]
src = ["land:15.84"]

[case.applies]
graziani = "yes"

[case.decision]
what = "Choose which Forward gun TOE points absorb Vulnerability losses"
params = ["gun TOE points"]
trigger = "triggered"
secrecy = "open"
interrupts = false

[[case]]
id = "15.85"
title = "Captured losses"
summary = "If TOE points are Captured, the player converts that percentage of his determined losses into prisoners or captured equipment given to the enemy; captured percentages round up."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.close_assault"]
depends_on = ["15.73", "28.0"]
src = ["land:15.85"]

[case.applies]
graziani = "yes"

[[case]]
id = "15.86"
title = "Determining captured TOE points"
summary = "First determine eliminated TOE points, then take the Captured percentage of them, using any TOE points the owner picks to satisfy it (measured in Raw points); captured infantry become prisoner points one per TOE point; captured guns and tanks go to the enemy."
kind = "rule"
disposition = "decision"
seat = "either"
timing = ["opstage.movement_and_combat.combat.close_assault"]
depends_on = ["28.0"]
