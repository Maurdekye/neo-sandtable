title = "30% losses disorganize"
summary = "A side losing 30% or more of the TOE points committed to the assault (from committed units or not) puts 3 Disorganization Points on all its involved units; both sides may suffer this."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.close_assault"]
depends_on = ["6.21"]
