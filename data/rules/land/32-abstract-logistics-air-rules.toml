# Land Game rulebook registry (Land 2021 retype). Summaries are paraphrases.
[section]
id = "32.0"
book = "land"
title = "Abstract Logistics & Air Rules"
systems = ["land", "logistics", "air"]

[[case]]
id = "32.0"
title = "General rule: Abstract Logistics and Air Rules"
summary = "These rules apply only if the Land Game is played without the Air and Logistics Games. All supply expenditures of the Land and Air rules are replaced by Ammo and Fuel costs listed here; players get Motorization Points instead of trucks and Supply Units holding Ammo and Fuel. A commentary warns the abstract rules were never tested and may affect game balance."
kind = "commentary"
disposition = "none"
seat = "none"
timing = []
depends_on = ["scen:65.0"]
src = ["land:32.0"]

[case.applies]
graziani = "no"
graziani_note = "Official abstraction not used in the full-systems profile (decision D2)"

[[case]]
id = "32.1"
title = "Supply Units & Supply"
summary = "Heading for 32.11-32.18."
kind = "commentary"
disposition = "none"
seat = "none"
timing = []
src = ["land:32.1"]

[case.applies]
graziani = "no"
graziani_note = "Official abstraction not used in the full-systems profile (decision D2)"

[[case]]
id = "32.11"
title = "Ignore normal supplies"
summary = "All references to Ammo, Fuel, Stores and Water use are ignored; only the supply rules of this section apply."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["continuous"]
src = ["land:32.11"]

[case.applies]
graziani = "no"
graziani_note = "Official abstraction not used in the full-systems profile (decision D2)"

[[case]]
id = "32.12"
title = "Supply Units"
summary = "Supply Units are abstract substitutes for all supplies, shown by a Supply Dump counter."
kind = "definition"
disposition = "none"
seat = "none"
timing = ["continuous"]
src = ["land:32.12"]

[case.applies]
graziani = "no"
graziani_note = "Official abstraction not used in the full-systems profile (decision D2)"

[[case]]
id = "32.13"
title = "Capture of Supply Units"
summary = "A Supply Unit has no combat ability; an enemy combat unit entering its hex captures it and uses its supplies at once."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["continuous"]
src = ["land:32.13"]

[case.applies]
graziani = "no"
graziani_note = "Official abstraction not used in the full-systems profile (decision D2)"

[[case]]
id = "32.14"
title = "Stacking of Supply Units"
summary = "Supply Units have stacking value zero; at most five per Major City hex and three per other off-map hex; unlimited in the Tripoli/Tunisia boxes."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["continuous"]
src = ["land:32.14"]

[case.applies]
graziani = "no"
graziani_note = "Official abstraction not used in the full-systems profile (decision D2)"

[[case]]
id = "32.15"
title = "Contents"
summary = "A Supply Unit starts with and never exceeds 40 Ammo and 60 Fuel points; at zero both it is removed; supplies may be shuffled free of cost among units in the same hex in the Organization Phase."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["continuous"]
src = ["land:32.15"]

[case.applies]
graziani = "no"
graziani_note = "Official abstraction not used in the full-systems profile (decision D2)"

[[case]]
id = "32.16"
title = "Drawing supply by range"
summary = "A friendly combat unit may draw on a Supply Unit within half its CPA, traced as a medium truck (infantry on foot as infantry), not through impassable terrain or unoccupied enemy ZOCs."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["continuous"]
src = ["land:32.16"]

[case.applies]
graziani = "no"
graziani_note = "Official abstraction not used in the full-systems profile (decision D2)"

[[case]]
id = "32.17"
title = "Destroying Supply Units"
summary = "The owner spends half the CPA of all units in the hex (rounded up) and rolls one die per Supply Unit; 1-3 destroys it (add one if the hex has one or fewer stacking points); done before movement in a sub-segment, once per Supply Unit per sub-segment."
kind = "rule"
disposition = "decision"
seat = "logistics"
timing = ["opstage.movement_and_combat.movement"]
src = ["land:32.17"]

[case.applies]
graziani = "no"
graziani_note = "Official abstraction not used in the full-systems profile (decision D2)"

[case.decision]
what = "Try to destroy Supply Units in a hex"
params = ["hex", "supply units"]
trigger = "scheduled"
secrecy = "secret"
interrupts = false

[[case]]
id = "32.18"
title = "Dummy Supply Units"
summary = "One dummy Supply Unit per three real ones received or started with may be placed; moves like a real one, needs fewer motorization points, removed on discovery."
kind = "rule"
disposition = "decision"
seat = "logistics"
timing = ["opstage.movement_and_combat.movement"]
src = ["land:32.18"]

[case.applies]
graziani = "no"
graziani_note = "Official abstraction not used in the full-systems profile (decision D2)"

[case.decision]
what = "Place or move a dummy Supply Unit"
params = ["hex"]
trigger = "scheduled"
secrecy = "secret"
interrupts = false

[[case]]
id = "32.2"
title = "Supply Expenditures"
summary = "Heading for 32.21-32.25; players track Ammo and Fuel per Supply Unit; the Commonwealth Fleet and patrolling TOE need no supplies."
kind = "commentary"
disposition = "none"
seat = "none"
timing = []
src = ["land:32.2"]

[case.applies]
graziani = "no"
graziani_note = "Official abstraction not used in the full-systems profile (decision D2)"

[[case]]
id = "32.21"
title = "Ammo costs"
summary = "Ammo is spent per battalion-equivalent: a non-phasing unit needs 1 Ammo to take part in an Assault and 2 to Barrage; a phasing unit twice as much."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat"]
src = ["land:32.21"]

[case.applies]
graziani = "no"
graziani_note = "Official abstraction not used in the full-systems profile (decision D2)"

[[case]]
id = "32.22"
title = "Ammo spent at combat"
summary = "Ammo points are spent at the instant of combat."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat"]
src = ["land:32.22"]

[case.applies]
graziani = "no"
graziani_note = "Official abstraction not used in the full-systems profile (decision D2)"

[[case]]
id = "32.23"
title = "Fuel per stage"
summary = "Fuel is spent per Operations Stage: each battalion-equivalent spends the required Fuel the first time it is moved by land in the stage and may then move up to its CPA; exceeding the CPA costs more Fuel at that instant."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement"]
src = ["land:32.23"]

[case.applies]
graziani = "no"
graziani_note = "Official abstraction not used in the full-systems profile (decision D2)"

[[case]]
id = "32.24"
title = "Fuel amounts"
summary = "Tank battalions need two Fuel; tank companies one; gun-class and recce battalions (not camels) one; Motorization Points carrying infantry, gun battalions or a real Supply Unit need one; companies and other uses need none."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement"]
src = ["land:32.24"]

[case.applies]
graziani = "no"
graziani_note = "Official abstraction not used in the full-systems profile (decision D2)"

[[case]]
id = "32.25"
title = "Patrol supplies"
summary = "Patrolling costs no supplies."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.patrol"]
src = ["land:32.25"]

[case.applies]
graziani = "no"
graziani_note = "Official abstraction not used in the full-systems profile (decision D2)"

