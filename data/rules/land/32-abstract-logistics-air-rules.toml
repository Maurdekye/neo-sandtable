disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement"]
src = ["land:32.31"]

[case.applies]
graziani = "no"
graziani_note = "Official abstraction not used in the full-systems profile (decision D2)"

[[case]]
id = "32.32"
title = "Motorization needs"
summary = "A real Supply Unit needs 30 Motorization Points to move and a dummy 6; they attach or detach only in the Organization Phase; one lacking its minimum cannot move."
kind = "rule"
disposition = "decision"
seat = "logistics"
timing = ["opstage.organization.reorganization"]
src = ["land:32.32"]

[case.applies]
graziani = "no"
graziani_note = "Official abstraction not used in the full-systems profile (decision D2)"

