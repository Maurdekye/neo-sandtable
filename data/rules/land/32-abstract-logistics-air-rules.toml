what = "Assign motorization points to a Supply Unit"
params = ["supply unit", "points"]
trigger = "scheduled"
secrecy = "open"
interrupts = false

[[case]]
id = "32.33"
title = "Which phase it moves in"
summary = "A transported Supply Unit moves in either the Movement/Combat Phase (only if it starts and stays stacked with a friendly combat unit) or the Truck Convoy Phase, not both."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement", "opstage.truck_convoy_movement"]
