[[case]]
id = "32.37"
title = "Air transport"
summary = "Only Supply Units fly, one per player per Game-Turn, in the Organization Phase between major cities, villages or Tripoli/Tunisia boxes, spending 12 Fuel at the origin; none if enemy combat units are within five hexes of the origin; not past the easternmost (Axis) or westernmost (Commonwealth) row held by a friendly division; the destination must hold a friendly division or brigade HQ; the supply unit cannot move further that stage."
kind = "rule"
disposition = "decision"
seat = "logistics"
timing = ["opstage.organization.reorganization"]
