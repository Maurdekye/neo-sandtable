# Land Game rulebook registry (Land 2021 retype). Summaries are paraphrases.
[section]
id = "14.0"
book = "land"
title = "Anti-Armor Combat"
systems = ["land"]

[[case]]
id = "14.0"
title = "General rule: Anti-Armor Combat"
summary = "Direct fire by units with an Anti-Armor rating against enemy units with an Armor Protection rating. It happens before Close Assault and all its losses are taken first. TOE points may be assigned to Anti-Armor or Close Assault (a unit may be split by whole TOE points) but never to both in one segment; withheld units are not hit. Both sides fire simultaneously: totals for each target hex are rolled on the Anti-Armor table for Damage Points, which the fired-upon player applies to armor TOE points, leaving a Destroyed Tank marker."
kind = "procedure"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.anti_armor"]
tables = ["land.14.6.anti_armor_results"]
depends_on = ["14.1", "14.4"]
src = ["land:14.0"]

[case.applies]
graziani = "yes"

[[case]]
id = "14.1"
title = "Which Units May Participate in Anti-Armor Combat"
summary = "Heading for 14.11-14.15."
kind = "commentary"
disposition = "none"
seat = "none"
timing = []
src = ["land:14.1"]

[case.applies]
graziani = "yes"

[[case]]
id = "14.11"
title = "Only assigned units fire and are hit"
summary = "Only units assigned to the Anti-Armor sub-step fire, and only units actually committed to Anti-Armor or Close Assault are affected; armor withheld from combat is not."
kind = "rule"
disposition = "decision"
seat = "front_line"
timing = ["opstage.movement_and_combat.combat.force_assignment"]
depends_on = ["14.12", "14.26"]
src = ["land:14.11"]

[case.applies]
graziani = "yes"

[case.decision]
what = "Assign TOE points to Anti-Armor, Close Assault or withhold"
params = ["unit", "TOE points per role", "target hex"]
trigger = "scheduled"
secrecy = "secret_simultaneous"
interrupts = false

[[case]]
id = "14.12"
title = "Targets of Anti-Armor fire"
summary = "The phasing player directs Anti-Armor fire at an entire adjacent enemy hex; the non-phasing player fires at phasing Armor-class units assaulting the hex. Units that retreated before assault in a targeted hex are affected but cannot fire and cannot be withheld."
kind = "rule"
disposition = "decision"
seat = "front_line"
timing = ["opstage.movement_and_combat.combat.anti_armor"]
depends_on = ["13.28"]
src = ["land:14.12"]

[case.applies]
graziani = "yes"

[case.decision]
what = "Designate the target hex for Anti-Armor fire"
params = ["firing units", "target hex"]
trigger = "scheduled"
secrecy = "secret_simultaneous"
interrupts = false

[[case]]
id = "14.13"
title = "Back guns excluded"
summary = "An artillery unit with Anti-Armor rating in a Back position neither fires nor is affected by Anti-Armor fire; Anti-Armor guns are always Forward when firing."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.anti_armor"]
depends_on = ["12.1"]
src = ["land:14.13"]

[case.applies]
graziani = "yes"

[[case]]
id = "14.14"
title = "Anti-Armor guns have Vulnerability 2"
summary = "Artillery used in an Anti-Armor role has an automatic Vulnerability rating of 2."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.anti_armor"]
depends_on = ["12.19"]
src = ["land:14.14"]

[case.applies]
graziani = "yes"

[[case]]
id = "14.15"
title = "Parenthesised anti-armor ratings"
summary = "A parenthesised Anti-Armor rating may be used only if no unit in the hex has TOE points with non-parenthesised Anti-Armor ratings; replacement points do not affect this."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.anti_armor"]
src = ["land:14.15"]

[case.applies]
graziani = "yes"

[[case]]
id = "14.2"
title = "Restrictions on Anti-Armor Combat"
summary = "Heading for 14.21-14.27."
kind = "commentary"
disposition = "none"
seat = "none"
timing = []
src = ["land:14.2"]

[case.applies]
graziani = "yes"

[[case]]
id = "14.21"
title = "Withheld units not hit"
summary = "Units withheld from both Anti-Armor and Assault are not affected by Anti-Armor fire (defenders withheld may still take Close Assault effects)."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.anti_armor"]
src = ["land:14.21"]

[case.applies]
graziani = "yes"

[[case]]
id = "14.22"
title = "One Anti-Armor attack per hex"
summary = "A hex is attacked by Anti-Armor fire at most once per segment, but units from different hexes may combine their strength into that one fire."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.anti_armor"]
src = ["land:14.22"]

[case.applies]
graziani = "yes"

[[case]]
id = "14.23"
title = "Blind fire and reassignment"
summary = "The firing player may not know whether the target hex has armor. If the defender has no Armor Protection units in the hex the firer may reassign up to half (rounded down) of the Anti-Armor points to Close Assault for that segment."
kind = "rule"
disposition = "decision"
seat = "front_line"
timing = ["opstage.movement_and_combat.combat.anti_armor"]
depends_on = ["14.12"]
src = ["land:14.23"]

[case.applies]
graziani = "yes"

[case.decision]
what = "Reassign up to half of Anti-Armor points to Close Assault when no armor is present"
params = ["points reassigned"]
trigger = "triggered"
secrecy = "open"
interrupts = false

[[case]]
id = "14.24"
title = "Ammunition"
summary = "Ammunition for Anti-Armor fire is deducted as it is expended."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.anti_armor"]
depends_on = ["airlog:50.0"]
src = ["land:14.24"]

[case.applies]
graziani = "yes"

[[case]]
id = "14.25"
title = "Terrain adjusts column before firing"
summary = "Terrain effects on Anti-Armor are on the Terrain Effects Chart and in 14.3; column adjustments are made before firing."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.anti_armor"]
tables = ["land.8.37.terrain_effects"]
depends_on = ["14.3"]
src = ["land:14.25"]

[case.applies]
graziani = "yes"

[[case]]
id = "14.26"
title = "Split TOE points between roles"
summary = "A unit's TOE points may be divided between Anti-Armor and Assault but a point cannot do both in a segment."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.force_assignment"]
src = ["land:14.26"]

[case.applies]
graziani = "yes"

[[case]]
id = "14.27"
title = "Sending TOE points to different hexes"
summary = "The phasing player may send TOE points of one unit to different hexes whether they engage in Anti-Armor or Close Assault."
kind = "rule"
disposition = "decision"
seat = "front_line"
timing = ["opstage.movement_and_combat.combat.force_assignment"]
depends_on = ["14.11"]
src = ["land:14.27"]

[case.applies]
graziani = "yes"

[case.decision]
what = "Divide a unit's TOE points among target hexes"
params = ["unit", "points per hex"]
trigger = "scheduled"
secrecy = "secret_simultaneous"
interrupts = false

[[case]]
