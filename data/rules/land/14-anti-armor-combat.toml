[[case]]
id = "14.47"
title = "Self-propelled gun absorption"
summary = "The printed rule (armor plus vulnerability) is declared wrong: self-propelled guns use their Armor Protection like any other armored unit, and an SP gun barraging Back cannot absorb nor be affected by Anti-Armor fire."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.anti_armor"]
depends_on = ["12.1"]
interp = ["land-0008"]
src = ["land:14.47"]

[case.applies]
graziani = "yes"

[[case]]
id = "14.48"
title = "Halftrack-motorized infantry"
summary = "If the only points in the hex that anti-armor can hit are halftracks (certain motorized Axis leg infantry), they double their Armor Protection; losing one also costs its transporting truck points; at most two TOE points of such units can be lost per Anti-Armor fire segment."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.anti_armor"]
src = ["land:14.48"]

[case.applies]
graziani = "yes"

