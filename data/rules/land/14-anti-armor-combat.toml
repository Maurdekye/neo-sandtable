[case.applies]
graziani = "yes"

[[case]]
id = "14.32"
title = "Defender column shift"
summary = "Where defending armor sits in a terrain with an effect, the attacker's firepower column is shifted left (nine Actual points against Rough resolve on the eight column)."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.anti_armor"]
tables = ["land.8.37.terrain_effects"]
src = ["land:14.32"]

[case.applies]
graziani = "yes"

[[case]]
id = "14.33"
title = "Terrain not cumulative within the hex"
summary = "Terrain effects including fortifications do not stack; the defender takes the best, but hexside effects add to hex effects."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.anti_armor"]
src = ["land:14.33"]

[case.applies]
graziani = "yes"

[[case]]
id = "14.34"
title = "No Anti-Armor across certain hexsides"
summary = "No Anti-Armor fire may be directed from or against phasing TOE points assaulting through a ridge not crossed by track or road, down a slope hexside not crossed by road or track, or down an escarpment not crossed by a track."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.anti_armor"]
tables = ["land.8.37.terrain_effects"]
src = ["land:14.34"]

[case.applies]
graziani = "yes"

[[case]]
id = "14.35"
title = "Floor at row zero"
summary = "If shifts push the Anti-Armor strength row below 1, use the 0 row."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.anti_armor"]
src = ["land:14.35"]

[case.applies]
graziani = "yes"

