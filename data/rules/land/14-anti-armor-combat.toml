[case.applies]
graziani = "yes"

[[case]]
id = "14.42"
title = "Armor Protection absorbs damage"
summary = "A TOE point's Armor Protection rating is the Damage Points it absorbs before being destroyed; all units containing armored points may take losses."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.anti_armor"]
src = ["land:14.42"]

[case.applies]
graziani = "yes"

[[case]]
id = "14.43"
title = "Owner removes enough points"
summary = "The player undergoing fire removes at least enough TOE points to absorb the Damage Points, choosing which; higher-protection units absorb more. Example: 7 points absorbed by one M/13 (3) plus two M/11 (2 each)."
kind = "rule"
disposition = "decision"
seat = "either"
timing = ["opstage.movement_and_combat.combat.anti_armor"]
depends_on = ["14.44"]
src = ["land:14.43"]

[case.applies]
graziani = "yes"

[case.decision]
what = "Choose which armor TOE points absorb the damage"
params = ["TOE points removed"]
trigger = "triggered"
secrecy = "open"
interrupts = false

[[case]]
id = "14.44"
title = "Armor losses from any armor units in the hex"
summary = "Armor losses may come from any armor in the target hex whether assigned to Anti-Armor or Close Assault; armor withheld from both is not affected (see 13.28)."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.anti_armor"]
src = ["land:14.44"]

[case.applies]
graziani = "yes"

[[case]]
id = "14.45"
title = "Excess damage ignored"
summary = "Damage beyond what destroys all armor in the hex is ignored."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.anti_armor"]
src = ["land:14.45"]

[case.applies]
graziani = "yes"

[[case]]
id = "14.46"
title = "Destroyed Tank markers"
summary = "Destroyed tanks are marked with immobile Destroyed Tank markers that can be retrieved in the Repair Segment; record exactly what each represents (14.5)."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.anti_armor"]
