graziani_note = "Axis anti-tank replacement points for ad hoc batteries are likely not available in the Graziani window"

[[case]]
id = "19.81"
title = "HQ anti-tank capacity"
summary = "Axis brigade-level HQs (including Battle Groups) with an infantry-type symbol may contain up to six TOE points of anti-tank guns."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.organization.reorganization"]
src = ["land:19.81"]

[case.applies]
graziani = "conditional"
graziani_note = "Axis anti-tank replacement points for ad hoc batteries are likely not available in the Graziani window"

[[case]]
id = "19.82"
title = "Condition for augmenting"
summary = "An Axis brigade-level HQ may be augmented with anti-tank points only if all Axis anti-tank units on the map (including the Tripoli-Tunisia boxes) are at least 67% of maximum TOE."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.organization.reorganization"]
src = ["land:19.82"]

[case.applies]
graziani = "conditional"
graziani_note = "Axis anti-tank replacement points for ad hoc batteries are likely not available in the Graziani window"

[[case]]
id = "19.83"
title = "Augmentation procedure"
summary = "Augmentation assigns anti-tank replacement points to the HQ as if it were an anti-tank unit; the first assignment must be at least three points."
kind = "rule"
disposition = "decision"
seat = "logistics"
timing = ["opstage.organization.reorganization"]
depends_on = ["19.82"]
src = ["land:19.83"]

[case.applies]
graziani = "conditional"
graziani_note = "Axis anti-tank replacement points for ad hoc batteries are likely not available in the Graziani window"

[case.decision]
what = "Assign anti-tank replacement points to an Axis brigade-level HQ"
