trigger = "scheduled"
secrecy = "open"
interrupts = false

[[case]]
id = "19.8"
title = "Forming Ad Hoc Axis Anti-Tank Batteries"
summary = "The Axis player may use Anti-Tank Gun Replacement Points to form ad hoc anti-tank batteries of 3 to 6 TOE points of any one AT gun; heading for 19.81-19.87."
kind = "commentary"
disposition = "none"
seat = "none"
timing = []
src = ["land:19.8"]

[case.applies]
