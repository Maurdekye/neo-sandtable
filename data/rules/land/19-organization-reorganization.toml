summary = "An HQ holding anti-tank points has a CPA equal to that of those points."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["continuous"]
src = ["land:19.85"]

[case.applies]
graziani = "conditional"
graziani_note = "Axis anti-tank replacement points for ad hoc batteries are likely not available in the Graziani window"

[[case]]
id = "19.86"
title = "One gun type per HQ"
summary = "Only one type of anti-tank gun per HQ (starting afresh if all are lost); captured guns cannot be used to augment."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.organization.reorganization"]
src = ["land:19.86"]

[case.applies]
graziani = "conditional"
graziani_note = "Axis anti-tank replacement points for ad hoc batteries are likely not available in the Graziani window"

[[case]]
id = "19.87"
title = "Stacking value stays zero"
summary = "An augmented HQ keeps a stacking value of zero whatever number of AT points it holds."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["continuous"]
src = ["land:19.87"]

[case.applies]
graziani = "conditional"
graziani_note = "Axis anti-tank replacement points for ad hoc batteries are likely not available in the Graziani window"

[[case]]
id = "19.9"
title = "Augmenting Commonwealth Battalions with Anti-Tank"
summary = "Heading for 19.91-19.98."
kind = "commentary"
disposition = "none"
seat = "none"
