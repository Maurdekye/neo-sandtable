trigger = "scheduled"
secrecy = "open"
interrupts = false

[[case]]
id = "19.72"
title = "German Battle Group limits"
summary = "A German Battle Group may carry up to four battalion-size units with at most one tank battalion and two infantry battalions, plus up to two extra companies."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.organization.reorganization"]
src = ["land:19.72"]

[case.applies]
graziani = "no"
graziani_note = "German formations do not appear in Graziani's Offensive"

[[case]]
id = "19.73"
title = "Italian Battle Groups"
summary = "Italians may form Battle Groups from the list on the Italian OA sheet (no counters): at most three battalion-size units (two infantry, one armor), one attached company, and at most two such groups at a time."
kind = "rule"
disposition = "decision"
seat = "either"
timing = ["opstage.organization.reorganization"]
depends_on = ["19.71"]
src = ["land:19.73"]

[case.applies]
graziani = "yes"

[case.decision]
what = "Form an Italian Battle Group from the OA list"
