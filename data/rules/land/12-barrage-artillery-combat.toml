kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.barrage"]
depends_on = ["airlog:41.5", "airlog:41.3"]
src = ["land:12.53"]

[case.applies]
graziani = "yes"

[[case]]
id = "12.54"
title = "Dumps and air facilities use raw points"
summary = "Barrage against supply dumps or air facilities uses the Air Bombardment Table (41.5) with Raw Barrage Points (not Actual) matched to the bombload column (78 Raw uses the 41-80 column)."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.barrage"]
depends_on = ["airlog:41.5"]
src = ["land:12.54"]

[case.applies]
graziani = "yes"

[[case]]
id = "12.55"
title = "Off-shore bombardment on facilities"
summary = "Off-shore bombardment may barrage facilities (see 30.12)."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.barrage"]
