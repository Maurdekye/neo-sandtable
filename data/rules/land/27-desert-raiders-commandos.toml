# Land Game rulebook registry (Land 2021 retype). Summaries are paraphrases.
[section]
id = "27.0"
book = "land"
title = "Desert Raiders & Commandos"
systems = ["land"]

[[case]]
id = "27.0"
title = "General rule: Desert Raiders and Commandos"
summary = "Commentary: the Long Range Desert Group and Die Sonderkommando Almasy had small operational effect but add fun, useful for harassment raids on dumps and convoys; the rule calls for honesty because raiders move secretly."
kind = "commentary"
disposition = "none"
seat = "none"
timing = []
src = ["land:27.0"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.1"
title = "The Long Range Desert Group"
summary = "Heading for 27.11-27.16."
kind = "commentary"
disposition = "none"
seat = "none"
timing = []
src = ["land:27.1"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.11"
title = "Two LRDG units"
summary = "The Commonwealth has two LRDG counters and never more than two in play."
kind = "definition"
disposition = "data"
seat = "none"
timing = ["continuous"]
src = ["land:27.11"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.12"
title = "Only fully trained units"
summary = "Only units in play that have trained up to their top Basic Morale qualify as the source of an LRDG."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.organization.reorganization"]
depends_on = ["17.3"]
src = ["land:27.12"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.13"
title = "Forming an LRDG"
summary = "LRDGs are formed in the Organization Phase from Recce and Armored Car TOE points only: remove the TOE point from the Recce/AC unit and place an LRDG unit on the map; it can never go back to Recce/AC status."
kind = "rule"
disposition = "decision"
seat = "commander"
timing = ["opstage.organization.reorganization"]
src = ["land:27.13"]

[case.applies]
graziani = "yes"

[case.decision]
what = "Form an LRDG from a Recce or armored car TOE point"
params = ["source unit", "hex"]
trigger = "scheduled"
secrecy = "open"
interrupts = false

[[case]]
id = "27.14"
title = "LRDG attributes"
summary = "An LRDG has CPA 50, no combat ratings, takes no normal combat (see 27.3) and has no stacking points."
kind = "definition"
disposition = "data"
seat = "none"
timing = ["continuous"]
src = ["land:27.14"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.15"
title = "No CP to form"
summary = "Forming an LRDG costs no CP."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.organization.reorganization"]
src = ["land:27.15"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.16"
title = "Re-forming after loss"
summary = "An eliminated LRDG can be re-formed (as in 27.13) four Game-Turns after its elimination (the example's dating style is obsolete)."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.organization.reorganization"]
depends_on = ["27.13"]
src = ["land:27.16"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.2"
title = "Die Sonderkommando Almasy"
summary = "The Axis raider group (DSA) is handled like an LRDG, but only one can exist and its source must be German armored recce or armored car TOE points, not Italian."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.organization.reorganization"]
depends_on = ["27.1"]
src = ["land:27.2"]

[case.applies]
graziani = "no"
graziani_note = "Formed only from German armored recce/car units, which are not in Graziani's Offensive"

[[case]]
id = "27.3"
title = "How Desert Raiders Are Used"
summary = "Heading for 27.31-27.38."
kind = "commentary"
disposition = "none"
seat = "none"
timing = []
src = ["land:27.3"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.31"
title = "Counters with hidden movement"
summary = "Desert raiders are real counters but their movement is mostly hidden."
kind = "definition"
disposition = "none"
seat = "none"
timing = ["continuous"]
src = ["land:27.31"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.32"
title = "Secret movement"
summary = "After formation the raider's location and movement are recorded secretly on paper, and it follows normal movement rules (as a Recce-type vehicle unit) while usually off the map."
kind = "rule"
disposition = "decision"
seat = "commander"
timing = ["opstage.movement_and_combat.movement"]
depends_on = ["8.0"]
src = ["land:27.32"]

[case.applies]
graziani = "yes"

[case.decision]
what = "Move a hidden desert raider and record its path"
params = ["raider", "path"]
trigger = "scheduled"
secrecy = "secret"
interrupts = false

[[case]]
id = "27.33"
title = "When raiders appear"
summary = "A raider stays hidden until it raids (27.5) or is spotted (27.4); then its counter goes on the map in the hex where that happened."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement"]
src = ["land:27.33"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.34"
title = "No ZOC; may enter enemy ZOC"
summary = "Raiders exert no ZOC and need not stop on entering an enemy ZOC (though they risk being spotted); entering an enemy-occupied hex is a raid."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement"]
depends_on = ["27.41"]
src = ["land:27.34"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.35"
title = "Raider supply"
summary = "Each Game-Turn (not stage) a raider must visit a friendly supply dump, oasis or bir, drawing one Ammunition and two Fuel points from a dump; without that fuel it cannot travel. Water comes from any oasis or bir, and a raider with no water by the end of the Game-Turn is eliminated."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement"]
depends_on = ["airlog:49.0", "airlog:52.0"]
src = ["land:27.35"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.36"
title = "Raiders may react"
summary = "Raiders have Reaction capability (27.44), including after any spotting attempt."
kind = "rule"
disposition = "decision"
seat = "commander"
timing = ["opstage.movement_and_combat.movement"]
depends_on = ["27.44", "8.5"]
src = ["land:27.36"]

[case.applies]
graziani = "yes"

[case.decision]
what = "React with a desert raider after a spotting attempt"
params = ["raider", "path"]
trigger = "triggered"
secrecy = "secret"
interrupts = true

[[case]]
id = "27.37"
title = "CPA limit"
summary = "A raider may never exceed its CPA of 50; if forced to, it is eliminated."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement"]
src = ["land:27.37"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.38"
title = "No fuel use or breakdown"
summary = "Raiders do not consume fuel (apart from 27.35) and do not break down."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["continuous"]
src = ["land:27.38"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.4"
title = "Spotting Desert Raiders"
summary = "Heading for 27.41-27.44."
kind = "commentary"
disposition = "none"
seat = "none"
timing = []
src = ["land:27.4"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.41"
title = "When spotting may occur"
summary = "A raider entering an enemy-controlled hex, or an enemy combat unit entering a hex holding a friendly raider, gives a chance to be spotted."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement"]
src = ["land:27.41"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.42"
title = "No entry into enemy-occupied hexes except to raid"
summary = "Raiders may enter enemy-occupied hexes only to raid."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement"]
src = ["land:27.42"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.43"
title = "Spotting roll"
summary = "The raider's owner announces the event and rolls one die; a 6 means the raider is spotted and eliminated; other rolls change nothing."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement"]
src = ["land:27.43"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.44"
title = "Enemy cost to spot"
summary = "A moving enemy unit entering the raider's hex pays 1 CP to try to spot it, even though the owner knows it is there (the mover may choose not to pursue); a phasing unit may try to spot a raider only once per Operations Stage."
kind = "rule"
disposition = "decision"
seat = "either"
timing = ["opstage.movement_and_combat.movement"]
src = ["land:27.44"]

[case.applies]
graziani = "yes"

[case.decision]
what = "Spend 1 CP to try to spot a raider when entering its hex"
params = ["unit", "hex"]
trigger = "triggered"
secrecy = "open"
interrupts = false

[[case]]
id = "27.5"
title = "Raids"
summary = "Raids are mostly harassment behind enemy lines, with an exception for 27.6. Heading for 27.51-27.59."
kind = "commentary"
disposition = "none"
seat = "none"
timing = []
src = ["land:27.5"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.51"
title = "Raid types"
summary = "The type of raid depends on the objective; most are harassment because they cause little damage, and take place behind enemy lines."
kind = "commentary"
disposition = "none"
seat = "none"
timing = []
src = ["land:27.51"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.52"
title = "Water pipeline raid"
summary = "A raider entering a pipeline hex with no enemy combat units there may announce a raid, appear, and roll one die (1-4 pipe blown, 5-6 safe); once per stage, costs 5 CP, and the raider may move on afterward; includes pipeline in railroad hexes."
kind = "rule"
disposition = "decision"
seat = "commander"
timing = ["opstage.movement_and_combat.movement"]
tables = ["land.27.91.desert_raider_raids"]
src = ["land:27.52"]

[case.applies]
graziani = "yes"

[case.decision]
what = "Attempt a raid on a water pipeline"
params = ["raider", "hex"]
trigger = "scheduled"
secrecy = "secret"
interrupts = false

[[case]]
id = "27.53"
title = "Airfield raid"
summary = "A raider may enter an enemy airfield hex with no enemy combat units (SGSUs do not count), reveal itself, and roll: a 1 or 2 reduces the airfield's capacity one level; costs 5 CP, no casualties; once per airfield per Game-Turn; may be combined with a plane raid; air landing strips and airfields in major cities are immune."
kind = "rule"
disposition = "decision"
seat = "commander"
timing = ["opstage.movement_and_combat.movement"]
tables = ["land.27.91.desert_raider_raids"]
depends_on = ["airlog:36.12"]
src = ["land:27.53"]

[case.applies]
graziani = "yes"

[case.decision]
what = "Attempt a raid on an enemy airfield"
params = ["raider", "hex"]
trigger = "scheduled"
secrecy = "secret"
interrupts = false

[[case]]
id = "27.54"
title = "Raid on grounded planes"
summary = "A raider may attack planes on the ground at an airfield or strip (not flying boats, not where combat units are present or in major cities): it spends 5 CP and rolls; 1-2 destroys at least 10% of the planes (raider chooses), 3-6 fails, and a 6 also eliminates the raider; may combine with 27.53 if all CP are paid."
kind = "rule"
disposition = "decision"
seat = "commander"
timing = ["opstage.movement_and_combat.movement"]
tables = ["land.27.91.desert_raider_raids"]
src = ["land:27.54"]

[case.applies]
graziani = "yes"

[case.decision]
what = "Attempt a raid on planes on the ground"
params = ["raider", "hex"]
trigger = "scheduled"
secrecy = "secret"
interrupts = false

[[case]]
id = "27.55"
title = "Raid on a supply dump"
summary = "A raider may attack any dump except in a major city, even a guarded one: it enters, reveals itself and spends 5 CP; unguarded, a roll of 1-2 destroys 10% of supplies; guarded, two dice are summed and compared with the guards' Raw Defensive Assault strength: higher lets the raid proceed as unguarded (but a 6 then eliminates the raider), otherwise the raider is eliminated."
kind = "rule"
disposition = "decision"
seat = "commander"
timing = ["opstage.movement_and_combat.movement"]
tables = ["land.27.91.desert_raider_raids"]
src = ["land:27.55"]

[case.applies]
graziani = "yes"

[case.decision]
what = "Attempt a raid on a supply dump"
params = ["raider", "hex"]
trigger = "scheduled"
secrecy = "secret"
interrupts = false

[[case]]
id = "27.56"
title = "Revealing a dummy dump"
summary = "If a surviving raider's target is a dummy dump, that is revealed and the supply destruction is off, though guard and elimination results stand."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement"]
src = ["land:27.56"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.57"
title = "Raids on convoys"
summary = "Raiders may attack unescorted truck convoys by entering the convoy's hex, or by interception during the opposing Truck Convoy Movement Phase (27.59)."
kind = "rule"
disposition = "decision"
seat = "commander"
timing = ["opstage.movement_and_combat.movement", "opstage.truck_convoy_movement"]
depends_on = ["27.58", "27.59"]
src = ["land:27.57"]

[case.applies]
graziani = "yes"

[case.decision]
what = "Attempt a raid on a truck convoy"
params = ["raider", "hex"]
trigger = "scheduled"
secrecy = "secret"
interrupts = false

[[case]]
id = "27.58"
title = "Convoy raid mechanics"
summary = "The raider spends 5 CP, enters, and rolls: 1-2 destroys one truck TOE point and its cargo (the defender picks the truck type, the raider the cargo); 3-6 fails. If any truck carries replacement points the raider adds one to the roll and a 6 eliminates it; if all carry replacement points it is eliminated automatically with no truck losses."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement", "opstage.truck_convoy_movement"]
tables = ["land.27.91.desert_raider_raids"]
src = ["land:27.58"]

[case.applies]
graziani = "yes"

[[case]]
id = "27.59"
title = "Interception"
summary = "If a truck convoy passes within four CP of a raider during the Truck Convoy Movement Phase, the raider's owner may halt and attack it using the convoy rules; the convoy uses 5 CP (not exceeding its CPA) as does the raider, which may then spend up to 5 more to leave."
kind = "rule"
disposition = "decision"
seat = "commander"
timing = ["opstage.truck_convoy_movement"]
depends_on = ["27.58"]
src = ["land:27.59"]

[case.applies]
graziani = "yes"

[case.decision]
what = "Intercept a passing truck convoy with a raider"
params = ["raider", "convoy"]
trigger = "triggered"
secrecy = "secret"
interrupts = true

