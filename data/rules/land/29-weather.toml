[case.applies]
graziani = "yes"

[[case]]
id = "29.52"
title = "No flying"
summary = "Aircraft cannot enter or leave a hex under a rainstorm, and rainstorms do reach the northern map edge over the sea."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.weather"]
src = ["land:29.52"]

[case.applies]
graziani = "yes"

[[case]]
id = "29.53"
title = "Wells fill"
summary = "All depleted wells are filled by a rainstorm."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.weather"]
depends_on = ["airlog:52.0"]
src = ["land:29.53"]

[case.applies]
graziani = "yes"

[[case]]
id = "29.54"
title = "No construction"
summary = "No construction may occur during a rainstorm (24.22)."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.organization.construction"]
depends_on = ["24.22"]
src = ["land:29.54"]

[case.applies]
graziani = "yes"

[[case]]
id = "29.55"
title = "Wadis impassable"
summary = "During a rainstorm all wadi hexsides are uncrossable except by road (29.56), and wadis cannot be used to draw water."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement"]
depends_on = ["8.41", "29.56"]
src = ["land:29.55"]

[case.applies]
graziani = "yes"

[[case]]
id = "29.56"
title = "Roads become tracks"
summary = "During rainstorms road hexes have the movement cost and breakdown rate of tracks; tracks stay as tracks, apart from 29.55."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement", "opstage.movement_and_combat.breakdown"]
src = ["land:29.56"]

[case.applies]
graziani = "yes"

[[case]]
id = "29.57"
title = "River hexsides"
summary = "In a rainstorm a river hexside can be crossed only where a road or railroad crosses it."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement"]
src = ["land:29.57"]

[case.applies]
graziani = "yes"

[[case]]
id = "29.58"
title = "Deltas"
summary = "A rainstorm bars vehicles and motorized units from delta hexes except along roads or railroads, and units already in a delta hex when it starts are stuck there for the stage unless on a road or railroad."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement"]
src = ["land:29.58"]

[case.applies]
graziani = "yes"

