summary = "Attached trucks move with their unit in the Movement and Combat Phase; unattached trucks move in the Truck Convoy Phase and may be reacted/retreated in the opponent's phase. In the convoy phase they cannot exceed CPA (involuntary overrun means capture), may move in any order and split freely, except that points starting and ending in the same hex on the same path move as a group."
kind = "rule"
disposition = "decision"
