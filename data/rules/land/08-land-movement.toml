[[case]]
id = "8.81"
title = "The Tripoli/Tunisia boxes"
summary = "Four large boxes (Tripolitania, Tripoli, Gabes, Tunis) plus smaller in-transit boxes on the west edge of map A stand for Axis entry regions and transit."
kind = "definition"
disposition = "data"
seat = "none"
timing = ["continuous"]
src = ["land:8.81"]

[case.applies]
graziani = "conditional"
graziani_note = "Used only if Axis arrivals or movement route through the off-map boxes"

[[case]]
id = "8.82"
title = "Only Axis units enter"
summary = "The Tripoli/Tunisia region is open to Axis units and Commonwealth aircraft only; Commonwealth land and naval units are always barred."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["continuous"]
src = ["land:8.82"]

[case.applies]
