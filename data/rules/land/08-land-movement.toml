graziani_note = "Used only if Axis arrivals or movement route through the off-map boxes"

[[case]]
id = "8.84"
title = "Stages needed to cross"
summary = "Stages required depend on the unit's CPA and come from the Off-Map Movement Distance Chart; a unit that cannot finish in one stage is shifted one In Transit box per stage, need not move each stage, and may turn back."
kind = "rule"
disposition = "decision"
seat = "either"
timing = ["opstage.movement_and_combat.movement"]
