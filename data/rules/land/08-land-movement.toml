[[case]]
id = "8.83"
title = "Off-map movement is abstracted"
summary = "Land movement to, from and among the boxes is abstracted: the distance is a count of Operations Stages in which a unit spends exactly its full CPA. Motorized units burn fuel but do not check Breakdown in this region. Air movement follows the Air Distance Chart."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement"]
tables = ["land.8.89.off_map_movement_distance"]
