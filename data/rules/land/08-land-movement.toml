[case.applies]
graziani = "yes"

[[case]]
id = "8.97"
title = "Attaching and detaching trucks"
summary = "Trucks attach to such a unit only in the Organization Phase (unless the unit itself is being attached to a parent that stage), and detach only then, or when a parent detaches subordinate units during Movement and Combat and sends a share of trucks with them. A unit at cohesion -5 or worse cannot detach all its trucks."
kind = "rule"
disposition = "decision"
seat = "either"
