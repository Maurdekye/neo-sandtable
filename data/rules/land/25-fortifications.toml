[[case]]
id = "25.23"
title = "Air attacks against fortified units"
summary = "Air bombardment and strafing of units, trucks, flak and supply dumps in fortifications is treated like artillery barrage for column adjustments, except that air bombardment has no effect on those targets in a Level 3 city until the city is reduced to Level 2."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat"]
depends_on = ["airlog:41.0", "airlog:40.8"]
src = ["land:25.23"]

[case.applies]
graziani = "yes"

[[case]]
id = "25.24"
title = "Level 3 cities ignore pins"
summary = "All units in a Level 3 city ignore Pinned results from any type of combat."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat"]
