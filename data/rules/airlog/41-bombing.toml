[[case]]
id = "41.21"
title = ""
summary = "Land support bombers receive a specific mission and hex in the Mission Assignment Segment (for example B-PF/Tobruk for bombing port facilities); one counter per bomber type per mission is placed in the target hex unless intercepted en route by enemy offensive CAP (40.27) or scramblers. The flight path therefore matters."
kind = "procedure"
disposition = "decision"
seat = "air"
timing = ["opstage.land_support_air.assignment", "opstage.land_support_air.deployment"]
depends_on = ["37.12", "40.27"]
src = ["airlog:41.21"]
applies = { graziani = "yes" }
decision = { what = "Assign each land-support bomber group a bombing mission code, target hex, target and flight path.", params = ["squadron or planes", "mission code", "target hex", "flight path"], trigger = "scheduled", secrecy = "secret_simultaneous", interrupts = false }

[[case]]
id = "41.22"
title = ""
summary = "Once at the target hex, air-to-air combat is resolved, then flak, and then surviving bombers drop; the opposing player totals bomb tons against the target type's column on the Air Bombardment and Secondary Barrage Target table (two dice read sequentially) and applies the result; survivors return, exposed to interception on the way back."
kind = "procedure"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.air_combat", "opstage.land_support_air.flak", "opstage.land_support_air.completion", "opstage.land_support_air.return"]
tables = ["airlog.41.5.air_bombardment"]
src = ["airlog:41.22"]
applies = { graziani = "yes" }

[[case]]
id = "41.3"
title = "Land Support Bombing Missions"
summary = "All land-support bombing except mining harbors uses the Air Bombardment and Secondary Barrage Target table; mining uses the Mining Harbors by Plane table."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.completion"]
tables = ["airlog.41.5.air_bombardment", "airlog.41.39.mining_harbor_by_plane"]
src = ["airlog:41.3"]
applies = { graziani = "yes" }

[[case]]
id = "41.31"
title = ""
summary = "Bombing personnel (B-CU): the result is the number of battalion-equivalents pinned in the target hex (tanks and guns count double; AA units may be pinned in the way), chosen as for artillery barrage (12.2). Units in a major city cannot be bombed until its fortification is down to level 1 or less (not applying to fortification counters); units in level-2 fortifications elsewhere may be bombed with a one-column shift left."
kind = "rule"
disposition = "decision"
seat = "either"
timing = ["opstage.land_support_air.completion"]
depends_on = ["41.9", "12.2"]
errata = ["errata79:41.31"]
src = ["airlog:41.31"]
applies = { graziani = "yes" }
decision = { what = "As the bombed player, choose which units in the hex absorb the pin results, following the artillery barrage selection rule.", params = ["hex", "units pinned"], trigger = "triggered", secrecy = "open", interrupts = false }

[[case]]
id = "41.32"
title = ""
summary = "Bombing truck convoys (B-TC): the result is truck units destroyed, split by the defender as evenly as possible among truck types and cargo types; trucks in a major city cannot be bombed until its fortification is zero; attached first-line trucks can be bombed only by planes with D capability."
kind = "rule"
disposition = "decision"
seat = "either"
timing = ["opstage.land_support_air.completion"]
depends_on = ["53.1"]
src = ["airlog:41.32"]
applies = { graziani = "yes" }
decision = { what = "As the bombed player, choose which truck points are lost, spreading them evenly across truck and cargo types.", params = ["truck unit", "truck points lost by type and cargo"], trigger = "triggered", secrecy = "open", interrupts = false }

[[case]]
id = "41.33"
title = ""
summary = "Flak destruction (B-FS): the result is the number of TOE strength points with an AA rating destroyed; it happens after flak fire (unlike fighter suppression). Per the errata the table row reads Flak Destruction."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.completion"]
errata = ["errata79:41.5"]
src = ["airlog:41.33"]
applies = { graziani = "yes" }

[[case]]
id = "41.34"
title = ""
summary = "Bombing ships (B-CF): the result is Damage Points on the ships in the hex (30.34); the CW fleet cannot be bombed at night; torpedoes may be used (41.7); Axis coastal shipping can never be bombed."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.completion"]
depends_on = ["30.34", "41.7"]
src = ["airlog:41.34"]
applies = { graziani = "yes" }

[[case]]
id = "41.35"
title = ""
summary = "Bombing supply dumps (B-SD): the result is the percentage of each supply type destroyed; for every 10% destroyed one unattached truck point in the hex is also lost (defender's choice, spread evenly), rounding all numbers up."
kind = "rule"
disposition = "decision"
seat = "either"
timing = ["opstage.land_support_air.completion"]
depends_on = ["54.1"]
errata = ["errata79:41.35"]
src = ["airlog:41.35"]
applies = { graziani = "yes" }
decision = { what = "As the bombed player, choose which unattached truck points in a bombed dump hex are lost.", params = ["hex", "truck points lost"], trigger = "triggered", secrecy = "open", interrupts = false }

[[case]]
id = "41.36"
title = ""
summary = "Bombing air facilities (B-AF): the result is capacity levels destroyed, and for each level destroyed 10% of the planes on the ground are lost (rounded down)."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.completion"]
depends_on = ["36.14"]
src = ["airlog:41.36"]
applies = { graziani = "yes" }

[[case]]
id = "41.37"
title = ""
summary = "Bombing major cities or fortifications (B-F/C): a major city or fortified hex may be bombed (major cities also at night), but only one fortification level may be destroyed per OpStage (22.35). The mission can also neutralize a temporary repair facility outside a major city for an OpStage on a one-level result."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.completion"]
depends_on = ["22.35", "41.4"]
src = ["airlog:41.37"]
applies = { graziani = "yes" }

[[case]]
id = "41.38"
title = ""
summary = "Bombing roads or railroads (B-R, B-RR): same table as cities with the road or rail row; roads in coastal hexes may be bombed at night; the result is the hex's road or railroad destroyed (railroads are easy to repair)."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.completion"]
tables = ["airlog.41.5.air_bombardment"]
src = ["airlog:41.38"]
applies = { graziani = "yes" }

[[case]]
id = "41.39"
title = "Mining Harbors and Bombing Ports"
summary = "A. Mining (B-MH): roll once per six bombers on the Mining Harbors by Plane table (using average bombload); on success place a mine counter in the port, which acts like harbor blocking (55.27). B. Bombing ports (B-P): total bombload plus strafing delivered, use the Air Bombardment table; the result is efficiency levels lost by the port (41.8 for Tripoli), and torpedoes may be used."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.completion"]
tables = ["airlog.41.39.mining_harbor_by_plane", "airlog.41.5.air_bombardment"]
depends_on = ["55.1", "55.27", "41.8"]
src = ["airlog:41.39"]
applies = { graziani = "yes" }

