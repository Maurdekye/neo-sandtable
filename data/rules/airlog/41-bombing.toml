[section]
id = "41.0"
book = "airlog"
title = "Bombing Missions"
systems = ["air"]

[[case]]
id = "41.0"
title = "General Rule and Procedure"
summary = "Any plane with bombload above zero may bomb; targets vary by mission type, some planes can bomb at night (less chance of interception, less damage), and some can bomb and strafe together (39.2). The effect is found by totaling bomb tonnage and using the Air Bombardment table for the target type. In the Strategic Air Planning stage each player assigns bombers in writing either to land support (specific missions chosen later each OpStage) or to strategic convoy recon/bombing (CW only); Malta raids resolve at once and bombers used for them or for convoy missions are unavailable until the next Game-Turn."
kind = "procedure"
disposition = "decision"
seat = "air"
timing = ["strategic_air.designation", "strategic_air.mission_assignment"]
tables = ["airlog.41.5.air_bombardment"]
depends_on = ["39.0", "39.16"]
src = ["airlog:41.0"]
applies = { graziani = "yes" }
decision = { what = "In the Strategic Air Planning stage, designate each bomber squadron to land support, Malta raids (Axis), convoy protection (Axis) or convoy recon/bombing (CW).", params = ["squadron", "designation"], trigger = "scheduled", secrecy = "secret_simultaneous", interrupts = false }

