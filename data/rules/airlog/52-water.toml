[section]
id = "52.0"
book = "airlog"
title = "Water"
systems = ["logistics"]

[[case]]
id = "52.0"
title = "General Rule"
summary = "Water is vital but seldom decisive. It comes from wells (birs) mostly near the coast; wells can be depleted by use or poisoned, depleted ones refill with rain, poisoned ones can be sweetened, and pipelines can extend access. Each OpStage players distribute water to the units that need it."
kind = "rule"
disposition = "decision"
seat = "logistics"
timing = ["opstage.organization.water_distribution"]
depends_on = ["52.4", "52.5"]
src = ["airlog:52.0"]
applies = { graziani = "yes" }
decision = { what = "Distribute available water (from units' holdings, dumps, convoy trucks unloaded, wells) to the units that need it this OpStage.", params = ["hex", "unit", "water points issued"], trigger = "scheduled", secrecy = "open", interrupts = false }

[[case]]
id = "52.1"
title = "Wells"
summary = "Group heading for where water comes from and how wells are drawn on, depleted, poisoned and sweetened."
kind = "commentary"
disposition = "none"
seat = "none"
timing = []
src = ["airlog:52.1"]
applies = { graziani = "yes" }

[[case]]
id = "52.11"
title = ""
summary = "Water exists only in wells (extendable by pipeline) and oases. Every major city, village, bir and oasis hex has a well automatically and no other hex does; the Tripoli and Tunisia boxes have unlimited wells."
kind = "definition"
disposition = "data"
seat = "none"
timing = ["continuous"]
depends_on = ["52.3"]
src = ["airlog:52.11"]
applies = { graziani = "yes" }

[[case]]
id = "52.12"
title = ""
summary = "The Water Availability Table gives, per source type, the water drawn and the chance of depletion."
kind = "rule"
disposition = "data"
seat = "none"
timing = ["opstage.movement_and_combat.movement"]
tables = ["airlog.52.7.water_availability"]
src = ["airlog:52.12"]
applies = { graziani = "yes" }

[[case]]
id = "52.13"
title = ""
summary = "To draw water a unit enters a well hex, spends 1 CP and (except in major cities and oases) rolls a die, reading the village or bir column of the Water Availability Table for the Water Points obtained and whether the well becomes depleted. Major-city and oasis wells are unlimited, cannot be depleted or poisoned, and let a unit draw as much as it can carry. A correction states the table governs and a depleted result needs a roll of 1."
kind = "procedure"
disposition = "decision"
seat = "either"
timing = ["opstage.movement_and_combat.movement"]
tables = ["airlog.52.7.water_availability"]
depends_on = ["52.12", "52.14"]
errata = ["errata79:52.13"]
src = ["airlog:52.13"]
applies = { graziani = "yes" }
decision = { what = "Choose to draw water at a well hex the unit has entered (paying 1 CP and risking depletion), and how much to take.", params = ["drawing unit", "well hex"], trigger = "triggered", secrecy = "open", interrupts = false }

[[case]]
id = "52.14"
title = ""
summary = "The drawing player secretly notes a depleted well; an enemy who later pays the CP to draw there is told it is dry, and the revealed well gets a depleted marker."
kind = "rule"
disposition = "display"
seat = "none"
timing = ["opstage.movement_and_combat.movement"]
src = ["airlog:52.14"]
applies = { graziani = "yes" }

[[case]]
id = "52.15"
title = ""
summary = "A depleted well stays dry until a rainstorm; every depleted well on a map section hit by rain refills at once."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.weather"]
depends_on = ["29.0"]
src = ["airlog:52.15"]
applies = { graziani = "yes" }

[[case]]
id = "52.16"
title = ""
summary = "Any unit in a village or bir hex with a well may spend 1 CP and roll a die to poison it; a 1 poisons it, 2-6 fails and bars further attempts on that well that OpStage. Major-city and oasis wells cannot be poisoned. Poisoned wells may be kept secret like depleted ones. (Table 52.8.)"
kind = "procedure"
disposition = "decision"
seat = "either"
timing = ["opstage.movement_and_combat.movement"]
tables = ["airlog.52.8.poisoning_and_sweetening"]
depends_on = ["52.14"]
src = ["airlog:52.16"]
applies = { graziani = "yes" }
decision = { what = "Attempt to poison a village or bir well in the unit's hex.", params = ["unit", "well hex"], trigger = "triggered", secrecy = "secret", interrupts = false }

[[case]]
id = "52.17"
title = ""
summary = "Any land unit may spend 5 CP and roll a die to sweeten a poisoned well (1-3 cleans it); repeated attempts at 5 CP each are allowed, but never beyond the unit's CPA."
kind = "procedure"
disposition = "decision"
seat = "either"
timing = ["opstage.movement_and_combat.movement"]
tables = ["airlog.52.8.poisoning_and_sweetening"]
depends_on = ["52.16"]
src = ["airlog:52.17"]
applies = { graziani = "yes" }
decision = { what = "Attempt to sweeten a poisoned well in the unit's hex.", params = ["unit", "well hex"], trigger = "triggered", secrecy = "open", interrupts = false }

[[case]]
id = "52.2"
title = "Water Pipelines"
summary = "Group heading for pipeline construction and vulnerability."
kind = "commentary"
disposition = "none"
seat = "none"
timing = []
src = ["airlog:52.2"]
applies = { graziani = "yes" }

[[case]]
id = "52.21"
title = ""
summary = "Pipelines extend access to water from a source that is a well in a major city."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.organization.construction"]
src = ["airlog:52.21"]
applies = { graziani = "yes" }

[[case]]
id = "52.22"
title = ""
summary = "A pipeline may run any length from a major-city well. The CW may treat any operating railroad hex as pipeline and build pipelines from any railroad hex; the Axis may not use the defunct Barce-Benghazi railroad this way."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.organization.construction"]
src = ["airlog:52.22"]
applies = { graziani = "yes" }

[[case]]
id = "52.23"
title = ""
summary = "Any pipeline or railroad hex serving as one is an unlimited water source like a major city: cannot be poisoned or depleted, but can be destroyed."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement"]
src = ["airlog:52.23"]
applies = { graziani = "yes" }

[[case]]
id = "52.24"
title = ""
summary = "An engineer battalion or CW HQ in its engineering role builds one pipeline hex in one Construction Phase for 10 stores; only one pipeline hex may be built per OpStage."
kind = "procedure"
disposition = "decision"
seat = "rear_area"
timing = ["opstage.organization.construction"]
depends_on = ["24.0", "51.14"]
src = ["airlog:52.24"]
applies = { graziani = "yes" }
decision = { what = "Order an engineer unit to build (or repair) one hex of water pipeline, paying 10 stores.", params = ["engineer unit", "pipeline hex"], trigger = "scheduled", secrecy = "open", interrupts = false }

[[case]]
id = "52.25"
title = ""
summary = "Pipelines (not railroad hexes) are destroyed by desert raiders, an enemy unit in the hex, or strafing; a railroad pipeline falls when the railroad does. Water then comes only from the farthest still-connected hex. Repair costs the same as building."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement", "opstage.land_support_air.completion"]
depends_on = ["52.24", "40.5"]
src = ["airlog:52.25"]
applies = { graziani = "yes" }

[[case]]
id = "52.3"
title = "Oases"
summary = "An oasis hex keeps its terrain effects but is a natural water and stores dump with unlimited, unpoisonable wells; units sitting there always have enough water and stores for the whole game. No pipeline can start at an oasis."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.organization.water_distribution", "logistics.stores_expenditure"]
depends_on = ["52.11", "51.0"]
src = ["airlog:52.3"]
applies = { graziani = "yes" }

[[case]]
id = "52.4"
title = "Water Usage Rates"
summary = "Group heading for the quantities of water units need."
kind = "commentary"
disposition = "none"
seat = "none"
timing = []
src = ["airlog:52.4"]
applies = { graziani = "yes" }

[[case]]
id = "52.41"
title = ""
summary = "Each infantry battalion or company needs one Water Point per OpStage regardless of strength; see also the pasta rule."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.organization.water_distribution"]
depends_on = ["52.6"]
src = ["airlog:52.41"]
applies = { graziani = "yes" }

[[case]]
id = "52.42"
title = ""
summary = "Each TOE point of vehicles (tank, recce, artillery etc.) or truck point needs one Water Point per OpStage if it uses any of its CPA."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.organization.water_distribution"]
src = ["airlog:52.42"]
applies = { graziani = "yes" }

[[case]]
id = "52.43"
title = ""
summary = "Hot weather raises water use; the extra amount is given in the weather rules."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.weather", "opstage.organization.water_distribution"]
depends_on = ["29.3"]
src = ["airlog:52.43"]
applies = { graziani = "yes" }

[[case]]
id = "52.44"
title = ""
summary = "Water, except what is still in wells and pipelines, suffers the fuel evaporation and spillage rates of 49.3."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["logistics.stores_expenditure", "opstage.weather"]
depends_on = ["49.3"]
src = ["airlog:52.44"]
applies = { graziani = "yes" }

[[case]]
id = "52.45"
title = ""
summary = "Water may be hauled by truck at the capacities shown in the Truck Characteristics Chart (reference corrected to 54.2)."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.truck_convoy_movement"]
tables = ["airlog.54.2.truck_characteristics"]
src = ["airlog:52.45"]
applies = { graziani = "yes" }

[[case]]
id = "52.5"
title = "Effects of Lack of Water"
summary = "Group heading for the penalties of thirst."
kind = "commentary"
disposition = "none"
seat = "none"
timing = []
src = ["airlog:52.5"]
applies = { graziani = "yes" }

[[case]]
id = "52.51"
title = ""
summary = "Vehicles without water cannot move or close-assault offensively; when defending against close assault their raw strength is halved."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement", "opstage.movement_and_combat.combat.close_assault"]
src = ["airlog:52.51"]
applies = { graziani = "yes" }

[[case]]
id = "52.52"
title = ""
summary = "Infantry-type units short of water may not voluntarily exceed CPA, cannot close-assault offensively and defend at half strength."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement", "opstage.movement_and_combat.combat.close_assault"]
src = ["airlog:52.52"]
applies = { graziani = "yes" }

[[case]]
id = "52.53"
title = ""
summary = "From the second consecutive OpStage without water onward, each infantry unit loses one TOE point per OpStage."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.organization.attrition"]
depends_on = ["52.52"]
src = ["airlog:52.53"]
applies = { graziani = "yes" }

[[case]]
id = "52.6"
title = "The Italian Pasta Rule"
summary = "Each Italian battalion needs one extra Water Point (the pasta point) when stores are distributed. A battalion without it cannot voluntarily exceed CPA that turn, and if its Cohesion Level is -10 or worse it becomes Disorganized as though at -26 until it gets the point, when its former level returns."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["logistics.stores_expenditure"]
depends_on = ["52.41", "51.0"]
src = ["airlog:52.6"]
applies = { graziani = "yes" }

[[case]]
id = "52.7"
title = "Water Availability Table"
summary = "Table giving water drawn per well draw and the depletion chance, by source type."
kind = "table"
disposition = "data"
seat = "none"
timing = ["opstage.movement_and_combat.movement"]
tables = ["airlog.52.7.water_availability"]
src = ["airlog:52.7"]
applies = { graziani = "yes" }

