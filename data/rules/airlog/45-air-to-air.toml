[[case]]
id = "45.61"
title = ""
summary = "Fighters shot down in air combat, and planes strafed on the ground (40.63), may in certain cases be recovered."
kind = "rule"
disposition = "none"
seat = "none"
timing = ["opstage.land_support_air.air_combat", "opstage.land_support_air.completion"]
src = ["airlog:45.61"]
applies = { graziani = "yes" }

[[case]]
id = "45.62"
title = ""
summary = "Strafed ground planes: spend 1 Stores and 1 Fuel Point per plane attempted, roll one die: 1-2 repairs it (supplies spent only on success), otherwise it is permanently destroyed; a repaired plane flies a full Game-Turn later."
kind = "procedure"
disposition = "decision"
seat = "air"
timing = ["opstage.land_support_air.maintenance"]
depends_on = ["40.63"]
src = ["airlog:45.62"]
applies = { graziani = "yes" }
decision = { what = "Choose which strafed grounded planes to attempt to repair, spending 1 Stores and 1 Fuel Point each.", params = ["plane", "SGSU or facility"], trigger = "triggered", secrecy = "open", interrupts = false }

[[case]]
id = "45.63"
title = ""
summary = "For a fighter shot down by planes or flak the owner rolls one die: a 1 means it never went down and limps home (together with its pilot); a 2 means only the pilot returns."
kind = "procedure"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.air_combat", "opstage.land_support_air.flak"]
depends_on = ["45.66"]
src = ["airlog:45.63"]
applies = { graziani = "yes" }

[[case]]
id = "45.64"
title = ""
summary = "A fighter that returned under 45.63 must still be repaired with the 45.62 supplies (1 Stores and 1 Fuel Point), but no die roll is needed."
kind = "procedure"
disposition = "decision"
seat = "air"
timing = ["opstage.land_support_air.maintenance"]
depends_on = ["45.63", "45.62"]
src = ["airlog:45.64"]
applies = { graziani = "yes" }
decision = { what = "Choose whether to pay the supplies to repair a fighter that limped home.", params = ["plane"], trigger = "triggered", secrecy = "open", interrupts = false }

[[case]]
id = "45.65"
title = ""
summary = "Fighters recovered and repaired this way do not count as kills for the optional ace rule (40.18)."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.air_combat"]
depends_on = ["40.18"]
src = ["airlog:45.65"]
applies = { graziani = "no", graziani_note = "Only relevant to the optional ace rule, which is not used." }

[[case]]
id = "45.66"
title = ""
summary = "For each fighter shot down the owner rolls a die: 1-2 the pilot bails out and is recovered wherever it fell, ready three OpStages later; otherwise he is killed."
kind = "procedure"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.air_combat", "opstage.land_support_air.flak"]
depends_on = ["40.17"]
src = ["airlog:45.66"]
applies = { graziani = "yes" }

[[case]]
id = "45.7"
title = "Extended Range"
summary = "A plane with several maneuver ratings must use the lower one on an extended-range mission unless the owner jettisons the extra tank, which allows the higher rating in air combat but forbids landing at any facility beyond normal range (a plane out of range of any friendly facility crash-lands if it survives). A fighter-bomber attacked on a bombing mission may jettison its bombs (no effect) to raise its maneuver rating."
kind = "rule"
disposition = "decision"
seat = "air"
timing = ["opstage.land_support_air.air_combat"]
depends_on = ["38.26", "37.23"]
src = ["airlog:45.7"]
applies = { graziani = "yes" }
decision = { what = "Choose whether to jettison extra tanks or bombs in an air-combat hex to gain the higher maneuver rating.", params = ["plane or squadron", "tanks or bombs"], trigger = "triggered", secrecy = "open", interrupts = false }
