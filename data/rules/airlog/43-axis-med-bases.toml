decision = { what = "Divide Mediterranean-based bombers into pseudo-squadrons of 6 to 12 for refit rolls.", params = ["area", "group composition"], trigger = "scheduled", secrecy = "secret", interrupts = false }

[[case]]
id = "43.23"
title = ""
summary = "Bombers based in Crete must be used to raid the Suez area each month, abstractly: in four OpStages of a month Crete flies no bombing missions, with no effect and no losses."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.assignment"]
src = ["airlog:43.23"]
applies = { graziani = "no", graziani_note = "German content." }

[[case]]
id = "43.24"
title = ""
summary = "Bombers flying from Crete may not receive CAP from planes in Africa."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.assignment"]
src = ["airlog:43.24"]
applies = { graziani = "no", graziani_note = "German content." }

[[case]]
