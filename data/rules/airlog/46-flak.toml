[[case]]
id = "46.25"
title = ""
summary = "Opposing planes on missions in a hex are grouped into target groups for AA purposes; the player owning the planes declares the groups' numbers and types but not their missions."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.flak"]
depends_on = ["46.26"]
src = ["airlog:46.25"]
applies = { graziani = "yes" }

[[case]]
id = "46.26"
title = ""
summary = "Target groups: (a) enemy non-fighter-mission planes on day missions, one group per mission; (b) the same at night, per mission; (c) day CAP, scramble and interception fighters; (d) night CAP/scramble/interception fighters; (e) planes on strafing and/or dive-bombing missions."
kind = "definition"
disposition = "data"
seat = "none"
timing = ["opstage.land_support_air.flak"]
src = ["airlog:46.26"]
applies = { graziani = "yes" }

[[case]]
id = "46.27"
title = ""
summary = "The owning player may fire AA at as many target groups as he wishes, in any order, naming which AA points and which TOE strength points of AA-rated units attack each group."
kind = "procedure"
disposition = "decision"
seat = "either"
timing = ["opstage.land_support_air.flak"]
tables = ["airlog.46.3.aa_combat_results"]
