[section]
id = "46.0"
book = "airlog"
title = "Anti-Aircraft Fire (Flak)"
systems = ["air"]

[[case]]
id = "46.0"
title = "General Rule and Procedure"
summary = "Planes on missions undergo AA fire in a hex with enemy AA, after air combat and flak suppression. AA points are TOE strength times AA rating; fire spends ammunition. Planes are grouped into target groups and each group is attacked on the Anti-Aircraft Combat Results table (two dice read sequentially); non-fighter groups first adjust the column for plane density and roll separately for planes destroyed and planes aborted, the victims chosen by an agreed random method."
kind = "procedure"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.flak"]
tables = ["airlog.46.3.aa_combat_results", "airlog.46.4.flak_adjustment"]
interp = ["airlog-0005"]
depends_on = ["46.26", "46.27"]
src = ["airlog:46.0"]
applies = { graziani = "yes" }

[[case]]
id = "46.1"
title = "Flak/AA Units"
summary = "Group heading for what can fire AA."
kind = "commentary"
disposition = "none"
seat = "none"
timing = []
src = ["airlog:46.1"]
applies = { graziani = "yes" }

[[case]]
id = "46.11"
title = ""
summary = "Units with an AA rating may fire at enemy planes (see 46.22); most are flak units marked by their symbol (pure flak units), while others carry AA ratings that multiply TOE strength to give actual AA points."
kind = "rule"
disposition = "data"
seat = "none"
timing = ["opstage.land_support_air.flak"]
src = ["airlog:46.11"]
applies = { graziani = "yes" }

[[case]]
id = "46.12"
title = ""
summary = "A flak unit with a parenthesised defense assault rating defends against assault only if alone in the hex; the German 88s and Italian 90mm are treated as artillery with assault ratings when attacked."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.combat.close_assault"]
src = ["airlog:46.12"]
applies = { graziani = "yes" }

[[case]]
id = "46.13"
title = ""
summary = "Flak units are like artillery in having their own transport; those without need trucks, each point of AA towed by a medium or heavy Truck Point."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.movement_and_combat.movement"]
src = ["airlog:46.13"]
applies = { graziani = "yes" }

[[case]]
id = "46.14"
title = ""
summary = "Flak units need supplies like artillery and use ammunition when firing."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.flak"]
tables = ["airlog.50.2.ammunition_consumption"]
depends_on = ["50.0"]
src = ["airlog:46.14"]
applies = { graziani = "yes" }

[[case]]
id = "46.15"
title = ""
summary = "Some tank and recce units carry AA points per TOE strength point (5 Sherman TOE points = 5 AA points)."
kind = "rule"
disposition = "data"
seat = "none"
timing = ["opstage.land_support_air.flak"]
src = ["airlog:46.15"]
applies = { graziani = "yes" }

[[case]]
id = "46.16"
title = ""
summary = "Tanks may use AA points only against fighters strafing units in their hex or against dive bombers."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.flak"]
src = ["airlog:46.16"]
applies = { graziani = "yes" }

[[case]]
id = "46.17"
title = ""
summary = "Pure AA/flak units stack freely in major cities (not counting against stacking limits); one stacks freely in an air landing strip hex and three in an airfield."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["continuous"]
src = ["airlog:46.17"]
applies = { graziani = "yes" }

[[case]]
