applies = { graziani = "yes" }

[[case]]
id = "46.21"
title = ""
summary = "AA fire can target only planes on missions in the same hex as the AA-capable units and facilities."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.flak"]
src = ["airlog:46.21"]
applies = { graziani = "yes" }

[[case]]
id = "46.22"
title = ""
summary = "Infantry, recce and tank units fire AA only at the fighter-mission, strafing and/or dive-bombing target group."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.flak"]
