src = ["airlog:40.71"]
applies = { graziani = "yes" }
decision = { what = "Assign fighters to a flak suppression mission over a target hex.", params = ["squadron or planes", "target hex"], trigger = "scheduled", secrecy = "secret_simultaneous", interrupts = false }

[[case]]
id = "40.72"
