summary = "Suppression causes no losses for either side: it diverts flak fire to cover other planes, but unsuppressed flak may still fire at any plane in the hex, suppression fighters included. It is a mission."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.flak"]
src = ["airlog:40.72"]
applies = { graziani = "yes" }

[[case]]
id = "40.73"
title = ""
summary = "Fighter flak suppression is flown after air-to-air combat but before any flak fire at planes."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.flak"]
src = ["airlog:40.73"]
applies = { graziani = "yes" }

[[case]]
id = "40.74"
title = ""
summary = "Every three suppressing fighters neutralize one AA point for that OpStage; only light AA and ship AA can be suppressed by fighters, not heavy AA."
kind = "rule"
disposition = "automatic"
seat = "none"
timing = ["opstage.land_support_air.flak"]
depends_on = ["46.1"]
