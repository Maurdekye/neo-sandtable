# Commonwealth Formation Organization Chart, land:19.31 (chart image "Allied Formation Chart").
# Schema: data/units/README.md, section "Formations". Each member is one printed symbol:
# `sp` is the stacking-point number printed in front of it (absent = no number printed).
# Period variants are separate records; `periods` lists the inclusive Game-Turn ranges (gt_to absent = open end).
[file]
nation = "cw"
src = ["land:19.31"]
transcribed_from = ["vassal:Allied Formation Chart.png"]
verification = "single"

# ---- legend: unit kinds -------------------------------------------------------------------

[[kind]]
id = "cw.tank_bn"
nation = "cw"
name = "Tank battalion"
echelon = "battalion"
symbol_echelon = "II"
match = { unit_type = "tank", echelon = "battalion" }
sp = 1
src = ["land:19.31"]

[[kind]]
id = "cw.inf_bn"
nation = "cw"
name = "Infantry battalion"
echelon = "battalion"
symbol_echelon = "II"
match = { unit_type = "infantry", echelon = "battalion", tags_any = ["leg", "motorized", "marine", "commando"] }
sp = 1
note = "Also covers a motorized, a marine or a commando infantry battalion."
src = ["land:19.31"]

[[kind]]
id = "cw.arty_unit"
nation = "cw"
name = "Artillery unit"
match = { unit_type = "artillery" }
sp = 1
note = "An artillery regiment, an artillery battalion or a self-propelled artillery regiment."
src = ["land:19.31"]

[[kind]]
id = "cw.at_regt"
nation = "cw"
name = "Anti-tank regiment"
echelon = "brigade"
symbol_echelon = "III"
match = { unit_type = "anti_tank", tags_any = ["anti_tank", "anti_tank_anti_air", "tank_destroyer"] }
sp = 1
note = "An anti-tank regiment, an anti-tank/anti-aircraft regiment or a tank destroyer regiment."
src = ["land:19.31"]

[[kind]]
id = "cw.at_unit"
nation = "cw"
name = "Anti-tank unit"
match = { unit_type = "anti_tank" }
note = "Any of the anti-tank regiment kinds above, or an anti-tank company (0 stacking points); the chart rows print no number with it."
src = ["land:19.31"]

[[kind]]
id = "cw.light_aa_unit"
nation = "cw"
name = "Light anti-aircraft unit"
match = { unit_type = "anti_air", tags_any = ["light"] }
sp = 1
note = "A light anti-aircraft regiment (III) or battalion (II). Printed without a number in the infantry-division row."
src = ["land:19.31"]

[[kind]]
id = "cw.mg_inf_bn"
nation = "cw"
name = "Machinegun infantry battalion"
echelon = "battalion"
symbol_echelon = "II"
match = { unit_type = "infantry", echelon = "battalion", tags_all = ["machinegun"] }
sp = 1
src = ["land:19.31"]

[[kind]]
id = "cw.armored_car_unit"
nation = "cw"
name = "Armored car unit"
match = { unit_type = "recce", tags_all = ["armored_car"] }
sp = 1
note = "An armored car regiment (III) or battalion (II)."
src = ["land:19.31"]

[[kind]]
id = "cw.armd_recon_unit"
nation = "cw"
name = "Armored reconnaissance unit"
match = { unit_type = "recce", tags_all = ["armored_recon"] }
sp = 1
note = "An armored reconnaissance regiment (III) or battalion (II)."
src = ["land:19.31"]

[[kind]]
id = "cw.eng_bn"
nation = "cw"
name = "Engineer battalion"
echelon = "battalion"
symbol_echelon = "II"
match = { unit_type = "engineer", echelon = "battalion" }
classes = ["cw.uu"]
sp = 1
note = "Either the 2/1 Australian Pioneer Battalion or a tank battalion made up solely of Scorpion tanks."
src = ["land:19.31"]

[[kind]]
id = "cw.any_small_unit"
nation = "cw"
name = "Any unit (stacking value one or zero)"
note = "Any unit other than a tank battalion whose counter shows a stacking point value of one or zero."
src = ["land:19.31"]

