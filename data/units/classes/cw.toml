# ID-code unit classes, land:4.46a. Field meanings: see data/units/README.md.
# Notes on the chart (paraphrased): `h`/`j` infantry are non-motorized (may be motorized by assigned
# truck points or, for the SAS, a Commonwealth LDG, land:27.88). Class `g` has max 9 tank points if it
# holds only US tanks (Grant/Sherman/Stuart). From GT 39 certain recce classes may be upgraded
# (land:20.5); from GT 75 classes `k`..`t` infantry may take anti-tank points (land:19.9); from
# GT 87 classes `n`,`p`,`r`,`s` may be upgraded (land:20.77). `*` = cpa_fixed, `+` = cpa_plus.
