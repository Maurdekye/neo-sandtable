# ID-code unit classes, land:4.46b. Field meanings: see data/units/README.md.
# Notes on the chart (paraphrased): `t` classes have their armor protection only while carried by
# trucks/motorization points (halftrack equivalent, land:14.88). `vv` units are Autoblinda 41 vehicles
# and `ww` Autoblinda 40; a unit of both ID codes has a BAR of 1 Left. Heavy-AA points arriving with
# an Italian unit carry the 75/46 gun. From GT 75 Italian Battle Groups and certain HQs may take
# anti-tank points (land:19.8); from GT 39 `ww` units may be upgraded (land:20.5). `HQ` echelon is set
# per OA unit. `*` = cpa_fixed, `+` = cpa_plus (historically fully trucked).
[file]
nation = "it"
src = ["land:4.46b"]
transcribed_from = ["vassal:Italian Unit Characteristics Chart.png"]
verification = "double"

