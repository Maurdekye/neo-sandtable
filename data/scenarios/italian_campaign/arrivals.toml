# Arrivals and withdrawals falling inside GT 1-20. Like the Graziani file, this only points at the rows
# of the whole-war schedules in data/units/schedules/; it carries no unit definitions of its own.
[file]
src = ["land:4.43a", "land:4.43b", "airlog:34.84", "airlog:34.87"]
range = { from_gt = 1, to_gt = 20 }
complete = true

[[source]]
file = "data/units/schedules/land_cw.toml"
rows = "exact GT rows inside the range, or monthly intervals overlapping the range"

