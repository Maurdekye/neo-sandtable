# Initial supply dumps and second/third-line trucks, scen:60.33-60.34 (Axis) and scen:60.43-60.44
# (Commonwealth). Amounts are supply points. A "-" in the printed table is an omitted field.
# First-line trucks are listed with the land deployment groups; they may be loaded with any supplies at
# no cost and over and above the amounts below (scen:59.45).
[file]
src = ["scen:60.33", "scen:60.34", "scen:60.43", "scen:60.44", "scen:59.4", "scen:59.5"]
transcribed_from = ["scenarios-booklet-2021.pdf pp.27-28 (page image)"]
verification = "single"

