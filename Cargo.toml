[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Maurdekye/neo-sandtable"
authors = ["maurdekye"]
version = "0.1.0"

[workspace.dependencies]
rand_core = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "warn"
