name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # hashFiles() only sees the workspace after checkout, so the guard lives on the steps,
      # not on the job.
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('web/package-lock.json') != '' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: ${{ hashFiles('web/package-lock.json') != '' }}
      - run: npm run lint
        if: ${{ hashFiles('web/package-lock.json') != '' }}
      - run: npm run test --if-present
        if: ${{ hashFiles('web/package-lock.json') != '' }}
      - run: npm run build
        if: ${{ hashFiles('web/package-lock.json') != '' }}

  rules-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/rules/coverage.py --self-test
      # Fails only on citation errors (unknown or malformed case ids in crates/cna-rules);
      # missing cases are informational and land in the job summary and the artifact.
      - run: python tools/rules/coverage.py --json coverage.json --markdown "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rule-coverage
          path: coverage.json
          if-no-files-found: ignore
